[package]
name = "assessment-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "assessment-rs"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["json", "tokio", "http1"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# governor 令牌桶限流(替代手写 AtomicU64)
governor = "0.8"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# cockroachdb (esp_assessment: assessment_sessions / assessment_answers) — #140 全服务切 CRDB
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-rustls", "macros", "chrono"] }

# redis cluster (IRT θ 缓存 esp:assess:theta:{user_id})
redis = { version = "0.26", features = ["tokio-comp", "aio", "connection-manager", "cluster", "cluster-async"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# esp 公共库(tracing init / db / redisx / health)
esp-common-rs = { path = "../../shared/esp-common-rs" }

anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
