# writing-py / teacher-java / emotion-svc
# 注:tidb-primary / tidb-follower / redis-cluster / pulsar-broker 由 05-infra-reuse.yaml 通过 ExternalName 提供。
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: writing-py, namespace: esp-prod}
spec:
  replicas: 1
  selector: {matchLabels: {app: writing-py}}
  template:
    metadata: {labels: {app: writing-py}}
    spec:
      securityContext:              # Phase1 1.6: pod 级 fsGroup+seccompProfile
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: writing-py
        image: esp/writing-py:1.7.0   # Phase1 L1 LLM 缓存:统一 key esp:cache:llm:exact:{model}:{sha256前16} + 旧 key llm:cache 双写迁移
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8082}]
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        env:
        # Phase1 L1 LLM 缓存:ESP_LLM_CACHE_ENABLED 为权威开关(兼容历史 CACHE_ENABLED);REDIS_HOST 默认 redis-cluster
        - {name: ESP_LLM_CACHE_ENABLED, value: "true"}
        - {name: REDIS_HOST, value: "redis-cluster"}
        - {name: REDIS_PORT, value: "6379"}
        # LLM 真实链路(上线达标 Phase0):取消 mock,走 AnthropicLlmProvider;经 CC Switch 代理(base_url/auth_token 注入)
        - {name: ANTHROPIC_API_KEY, valueFrom: {secretKeyRef: {name: esp-secrets, key: ANTHROPIC_API_KEY}}}
        - {name: ANTHROPIC_BASE_URL, valueFrom: {secretKeyRef: {name: esp-secrets, key: ANTHROPIC_BASE_URL}}}
        - {name: ANTHROPIC_AUTH_TOKEN, valueFrom: {secretKeyRef: {name: esp-secrets, key: ANTHROPIC_AUTH_TOKEN}}}
        # CRDB esp_writing(#140 全服务切 CRDB;esp-db-py 双池保持读写分离,DB_DRIVER=mysql 可回切 TiDB)
        - {name: DB_ENABLED, value: "true"}
        - {name: WRITE_DB_HOST, value: "crdb-public"}
        - {name: READ_DB_HOST, value: "crdb-public"}
        - {name: WRITE_DB_PORT, value: "26257"}
        - {name: READ_DB_PORT, value: "26257"}
        - {name: WRITE_DB_NAME, value: "esp_writing"}
        - {name: READ_DB_NAME, value: "esp_writing"}
        - {name: WRITE_DB_USER, value: "root"}
        - {name: READ_DB_USER, value: "root"}
        # OTel 注入(ADR-observability-rebuild):writing-py 已内置 opentelemetry-sdk(tracing.py),仅需 env
        - {name: OTEL_SERVICE_NAME, value: "writing"}
        - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.esp-prod.svc.cluster.local:4317"}
        - {name: OTEL_TRACES_EXPORTER, value: "otlp"}
        - {name: CRDB_HOST, value: "crdb-public"}   # AppLogClient 写 esp_shared(psycopg3)
        - {name: CRDB_PORT, value: "26257"}
        # Nacos 服务注册
        - {name: NACOS_ADDR, value: "nacos:8848"}
        - {name: POD_IP, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
        startupProbe:   {httpGet: {path: /healthz, port: 8082}, periodSeconds: 10, failureThreshold: 18, timeoutSeconds: 3}   # 180s 慢启动保护(granian 冷启动 + OTel 连 collector)
        readinessProbe: {httpGet: {path: /healthz, port: 8082}, periodSeconds: 10, failureThreshold: 3, timeoutSeconds: 3}
        livenessProbe:  {httpGet: {path: /healthz, port: 8082}, periodSeconds: 15, failureThreshold: 5, timeoutSeconds: 3}
        resources: {requests: {cpu: "100m", memory: "128Mi"}, limits: {cpu: "1", memory: "1Gi"}}
---
apiVersion: v1
kind: Service
metadata: {name: writing-py, namespace: esp-prod}
spec: {selector: {app: writing-py}, ports: [{port: 80, targetPort: 8082}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: teacher-java, namespace: esp-prod}
spec:
  replicas: 1              # 单节点 RD 资源紧张,JVM 服务暂缩 1 副本(原 2)
  selector: {matchLabels: {app: teacher-java}}
  template:
    metadata: {labels: {app: teacher-java}, annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8083", prometheus.io/path: "/actuator/prometheus"}}
    spec:
      securityContext:              # Phase1 1.6: pod 级 fsGroup+seccompProfile
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: teacher-java
        image: esp/teacher-java:1.10.0   # #145 CRDB 切库(集群已 PgConnection 实连 esp_teacher);#135 esp-web-common + #137 CRDB适配
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8083}]
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
        env:
        # #140/#145 切 CRDB:ESP_RW_STORAGE_TYPE=cockroachdb 激活 esp-rw-java CockroachDbDataSourceConfig,PG 双池指 crdb-public:26257/esp_teacher
        - {name: ESP_RW_STORAGE_TYPE,       value: "cockroachdb"}
        - {name: ESP_RW_COCKROACHDB_HOST,   value: "crdb-public"}
        - {name: ESP_RW_COCKROACHDB_READ_HOST, value: "crdb-public"}
        - {name: ESP_RW_COCKROACHDB_PORT,   value: "26257"}
        - {name: ESP_RW_COCKROACHDB_DB,     value: "esp_teacher"}
        - {name: ESP_RW_COCKROACHDB_USER,   value: "root"}
        - {name: WRITE_DB_URL, value: "jdbc:mysql://tidb-primary:4000/esp_teaching?useSSL=false&allowPublicKeyRetrieval=true"}   # 可回切保留
        - {name: READ_DB_URL, value: "jdbc:mysql://tidb-follower:4000/esp_teaching?useSSL=false&allowPublicKeyRetrieval=true"}   # 可回切保留
        - {name: DB_USER, value: "root"}
        - {name: DB_PASS, value: ""}
        - {name: NACOS_HOST, value: "nacos"}
        - {name: DUBBO_GROUP, value: "esp"}
        # OTel 注入(ADR-observability-rebuild):javaagent 已在镜像 JAVA_OPTS 中(Dockerfile ENTRYPOINT)
        - {name: OTEL_SERVICE_NAME, value: "teacher"}
        - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.esp-prod.svc.cluster.local:4317"}
        - {name: OTEL_TRACES_EXPORTER, value: "otlp"}
        # ADR-12 JWT 公钥(D2 修复):envFrom 注入 JWT_RSA_PUBLIC_KEY_PEM,供 JwtValidator 校验 BFF 签发的 RS256 JWT
        # P0-1 私钥收敛:改用 esp-rsa-jwt-verify(仅公钥),teacher 不再持有签发私钥
        envFrom:
        - secretRef: {name: esp-rsa-jwt-verify}
        startupProbe:   {httpGet: {path: /actuator/health/readiness, port: 8083}, periodSeconds: 10, failureThreshold: 60, timeoutSeconds: 10}   # httpGet 探针:Jetty acceptor hang 时 TCP 握手通但应用层死(tcpSocket 假 Ready 根因),改 httpGet 让 acceptor hang 被探针识破。
        readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8083}, periodSeconds: 30, failureThreshold: 3, timeoutSeconds: 5}   # period 放宽到 30s 减少 kubelet 探针 CLOSE_WAIT 堆积(单节点 VM 通病诱因)
        livenessProbe:  {httpGet: {path: /actuator/health/liveness, port: 8083}, periodSeconds: 30, failureThreshold: 3, timeoutSeconds: 15}  # 恢复 liveness:acceptor hang 时 HTTP 超时→kubelet 自愈重启,根治"假 Running 不响应"。timeout 15s 容忍单节点 VM GC 抖动
        resources: {requests: {cpu: "200m", memory: 768Mi}, limits: {cpu: "1", memory: 2048Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: teacher-java, namespace: esp-prod}
spec: {selector: {app: teacher-java}, ports: [{port: 80, targetPort: 8083}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: emotion-svc, namespace: esp-prod}
spec:
  replicas: 1
  selector: {matchLabels: {app: emotion-svc}}
  template:
    metadata: {labels: {app: emotion-svc}}
    spec:
      securityContext:              # Phase1 1.6: pod 级 fsGroup+seccompProfile
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: emotion-svc
        image: esp/emotion-svc:1.7.0   # #140 CRDB 切库:esp-db-py asyncpg + logging_client psycopg3
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8084}]
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        env:
        # CRDB esp_learning(#140 全服务切 CRDB;情绪事件写/历史读走 esp-db-py 双池)
        - {name: DB_ENABLED, value: "true"}
        - {name: WRITE_DB_HOST, value: "crdb-public"}
        - {name: READ_DB_HOST, value: "crdb-public"}
        - {name: WRITE_DB_PORT, value: "26257"}
        - {name: READ_DB_PORT, value: "26257"}
        - {name: WRITE_DB_NAME, value: "esp_learning"}
        - {name: READ_DB_NAME, value: "esp_learning"}
        - {name: WRITE_DB_USER, value: "root"}
        - {name: READ_DB_USER, value: "root"}
        # OTel 注入(ADR-observability-rebuild):emotion-svc 已内置 opentelemetry-sdk,仅需 env
        - {name: OTEL_SERVICE_NAME, value: "emotion"}
        - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.esp-prod.svc.cluster.local:4317"}
        - {name: OTEL_TRACES_EXPORTER, value: "otlp"}
        - {name: CRDB_HOST, value: "crdb-public"}   # AppLogClient 写 esp_shared(psycopg3)
        - {name: CRDB_PORT, value: "26257"}
        # Nacos 服务注册
        - {name: NACOS_ADDR, value: "nacos:8848"}
        - {name: POD_IP, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
        startupProbe:   {httpGet: {path: /healthz, port: 8084}, periodSeconds: 10, failureThreshold: 60, timeoutSeconds: 3}   # 600s 慢启动保护(AI 推理冷启动)
        readinessProbe: {httpGet: {path: /healthz, port: 8084}, periodSeconds: 10, failureThreshold: 3, timeoutSeconds: 3}
        livenessProbe:  {httpGet: {path: /healthz, port: 8084}, periodSeconds: 15, failureThreshold: 5, timeoutSeconds: 3}
        resources: {requests: {cpu: "100m", memory: "128Mi"}, limits: {cpu: "500m", memory: "512Mi"}}
---
apiVersion: v1
kind: Service
metadata: {name: emotion-svc, namespace: esp-prod}
spec: {selector: {app: emotion-svc}, ports: [{port: 80, targetPort: 8084}]}
---
# writing-coach: 写作增强服务(Litestar+Granian,ADR adr-writing-coach)。端口 8085。
# 模板/范文/综合批改/提升方案/进度跟踪。调 writing-py grade + learning weak mastery。
apiVersion: apps/v1
kind: Deployment
metadata: {name: writing-coach, namespace: esp-prod}
spec:
  replicas: 1
  selector: {matchLabels: {app: writing-coach}}
  template:
    metadata: {labels: {app: writing-coach}}
    spec:
      securityContext:              # Phase1 1.6: pod 级 fsGroup+seccompProfile
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: writing-coach
        image: esp/writing-coach:1.2.0   # #140 CRDB 切库:esp-db-py asyncpg + logging_client psycopg3
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8085}]
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        env:
        # LLM 真实链路(上线达标 Phase0):取消 mock;经 CC Switch 代理
        - {name: ANTHROPIC_API_KEY, valueFrom: {secretKeyRef: {name: esp-secrets, key: ANTHROPIC_API_KEY}}}
        - {name: ANTHROPIC_BASE_URL, valueFrom: {secretKeyRef: {name: esp-secrets, key: ANTHROPIC_BASE_URL}}}
        - {name: ANTHROPIC_AUTH_TOKEN, valueFrom: {secretKeyRef: {name: esp-secrets, key: ANTHROPIC_AUTH_TOKEN}}}
        # 协同服务地址(ADR adr-writing-coach §5)
        - {name: WRITING_PY_URL, value: "http://writing-py:80"}
        - {name: LEARNING_URL, value: "http://learning-java:80"}
        # CRDB esp_writing(#140 全服务切 CRDB;模板/范文读+计划/进度写走 esp-db-py 双池)
        - {name: DB_ENABLED, value: "true"}
        - {name: WRITE_DB_HOST, value: "crdb-public"}
        - {name: READ_DB_HOST, value: "crdb-public"}
        - {name: WRITE_DB_PORT, value: "26257"}
        - {name: READ_DB_PORT, value: "26257"}
        - {name: WRITE_DB_NAME, value: "esp_writing"}
        - {name: READ_DB_NAME, value: "esp_writing"}
        - {name: WRITE_DB_USER, value: "root"}
        - {name: READ_DB_USER, value: "root"}
        # Redis Cluster 多级缓存(esp-cache-py L2)
        - {name: CACHE_ENABLED, value: "true"}
        - {name: REDIS_HOST, value: "redis-cluster"}
        - {name: REDIS_PORT, value: "6379"}
        # OTel 注入
        - {name: OTEL_SERVICE_NAME, value: "writing-coach"}
        - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.esp-prod.svc.cluster.local:4317"}
        - {name: OTEL_TRACES_EXPORTER, value: "otlp"}
        - {name: CRDB_HOST, value: "crdb-public"}   # AppLogClient 写 esp_shared(psycopg3)
        - {name: CRDB_PORT, value: "26257"}
        # Nacos 服务注册
        - {name: NACOS_ADDR, value: "nacos:8848"}
        # LCO Phase2 L2 Milvus 语义缓存 + Phase3 L3 Neo4j 知识图谱(2026-08-19)
        # L2:复用共享 collection esp_llm_semantic(384dim minilm,cosine≥0.92),embedding 调 host.lima.internal
        - {name: L2_ENABLED, value: "true"}
        - {name: MILVUS_ADDR, value: "milvus:19530"}
        - {name: EMBEDDING_URL, value: "http://host.lima.internal:15730/embed"}
        # L3:Neo4j Prompt→Response 图谱(ExternalName → neo4j.platform-infra)
        - {name: L3_ENABLED, value: "true"}
        - {name: NEO4J_URL, value: "bolt://neo4j:7687"}
        - {name: NEO4J_USER, value: "neo4j"}
        - {name: NEO4J_PASSWORD, valueFrom: {secretKeyRef: {name: esp-secrets, key: NEO4J_PASSWORD}}}
        - {name: POD_IP, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
        startupProbe:   {httpGet: {path: /healthz, port: 8085}, periodSeconds: 10, failureThreshold: 24, timeoutSeconds: 3}   # 240s 慢启动保护(granian 冷启动 + pip 装公共包)
        readinessProbe: {httpGet: {path: /healthz, port: 8085}, periodSeconds: 10, failureThreshold: 3, timeoutSeconds: 3}
        livenessProbe:  {httpGet: {path: /healthz, port: 8085}, periodSeconds: 15, failureThreshold: 5, timeoutSeconds: 3}
        resources: {requests: {cpu: "100m", memory: "128Mi"}, limits: {cpu: "1", memory: "1Gi"}}
---
apiVersion: v1
kind: Service
metadata: {name: writing-coach, namespace: esp-prod}
spec: {selector: {app: writing-coach}, ports: [{port: 80, targetPort: 8085}]}
