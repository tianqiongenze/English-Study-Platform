# NetworkPolicy — 网络分段(P0-6 收窄,2026-08-14)。
#
# 背景:坑㉕ 修复时曾把 esp-allow-internal patch 为 namespaceSelector:{} 放行所有 namespace,
#   导致跨项目(如 education-platform)pod 可达 esp-prod 任意服务。本次收窄为精确白名单。
#
# 策略:
#   1. esp-default-deny-ingress:全 pod 默认拒绝 ingress(零信任基线)。
#   2. esp-allow-internal:分三类放行——
#      a) 同命名空间(esp-prod)pod 互通(服务间内部信任);
#      b) traefik 入口控制器(kube-system ns)可达 esp-prod 业务 pod 的 80/8090/9090(ingress 转发);
#      c) 节点本机/NodePort 流量(kube-proxy DNAT,源 IP 为节点 IP 或 VM bridge)进 gateway 8080 / bff 8090/9090 / 前端 80。
#   3. 不再用 namespaceSelector:{} 全放行——只显式放行 kube-system(traefik 所在)。
#
# 跨命名空间基础设施(TiDB/Redis/Pulsar 等)走 ExternalName/K8s DNS,NetworkPolicy 仅管控同 ns pod,
# 故基础设施可达性不受本策略影响。
#
# 注意:单节点 Rancher Desktop 的 CNI(k3s 默认 flannel)对 NetworkPolicy 支持有限(无 Calico/Cilium 强制),
#   本清单主要保证:多节点移植时策略可立即生效 + 声明意图(可移植性)。
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: esp-default-deny-ingress
  namespace: esp-prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: esp-allow-internal
  namespace: esp-prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # a) 同命名空间(esp-prod)pod 互通(服务网格内部信任)
    - from:
        - podSelector: {}
    # b) traefik 入口(kube-system ns)可达业务端口 80/8090/9090
    #    P0-6 收窄:从 namespaceSelector:{} 改为精确匹配 kube-system(traefik 所在),
    #    避免放行所有跨项目 ns。
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8090
        - protocol: TCP
          port: 9090
    # c) 节点本机/NodePort 流量进入(NodePort 由 kube-proxy 在节点 DNAT 转发,源 IP 为节点 IP)
    #    gateway 8080(WS)/ bff 8090+9090 / 前端 80 / nacos 8848 / sentinel 8858 / seata 7091+8091
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8090
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8848
        - protocol: TCP
          port: 8858
        - protocol: TCP
          port: 7091
        - protocol: TCP
          port: 8091
    # d) 可观测性命名空间(esp-observability)Prometheus 抓取业务 actuator 指标端口
    #    双轨(P3-19):8081=learning-java / 8083=teacher-java 的 /actuator/prometheus;
    #    gateway 8080/bff 8090 已在上方放行。2026-08-16 P3 加(坑㉕ 同类端口白名单缺口)。
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: esp-observability
      ports:
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8083
