# frontend-portal nginx:统一多端入口。
# 职责:
#   1. 自身托管 portal 入口页 index.html(纯静态,无构建)
#   2. /web/ → 反代 frontend-react(同 ns ClusterIP:80)
#   3. /h5/  → 反代 frontend-h5(同 ns ClusterIP:80)
#   4. /api/ + /ws/ → 按 path 直连各后端 ClusterIP(复刻 esp-ingress 路由规则)
#
# 设计:portal 作为唯一 NodePort(30070)对外暴露,Mac host 可达。
# 内部前端三个容器(frontend-react/h5/miniprogram 源码)通过 ClusterIP 复用,不重复暴露 NodePort。
# 符合 education-platform 的 portal 模式(单域名分发多端),但用 NodePort 替代 traefik LB。
#
# 路由说明(2026-08-14):原设计 /api /ws 反代 traefik(Host esp.example.com)由 Ingress 分发,
# 但单节点 traefik ingress controller pod 已不在运行(svc traefik 仍是 LoadBalancer 但 endpoints <none>),
# 故改为按 path 直连各后端 ClusterIP,复刻 esp-ingress 的 9 条 path 规则,绕过 traefik 依赖。

upstream react_backend {
    server frontend-react:80;
}
upstream h5_backend {
    server frontend-h5:80;
}
upstream bff_backend {
    server bff-java:8090;
}
upstream gateway_backend {
    server gateway-go:80;
}
upstream learning_backend {
    server learning-java:80;
}
upstream teacher_backend {
    server teacher-java:80;
}
upstream writing_backend {
    server writing-py:80;
}
upstream writing_coach_backend {
    server writing-coach:80;
}
upstream emotion_backend {
    server emotion-svc:80;
}

server {
    listen 80;
    server_name _;

    # portal 入口页(根路径)
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }
    location = /index.html {
        root /usr/share/nginx/html;
    }

    # Web 端:frontend-react 全量反代(react 自身的 /api /ws 由它自己再反代 traefik)
    location /web/ {
        proxy_pass http://react_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # react 子应用自身的 /api /ws 请求会带 /web 前缀,这里重写回根
        # 注:react 内 nginx 对 /api 已配反代,此处透传即可
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # H5 端:frontend-h5 全量反代
    location /h5/ {
        proxy_pass http://h5_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # /api 按路径直连各后端 ClusterIP(复刻 esp-ingress 的 9 条 path 规则,绕过 traefik)
    location /api/auth/ {
        proxy_pass http://bff_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
    location /api/scenarios {
        proxy_pass http://gateway_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
    location /api/sessions {
        proxy_pass http://gateway_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
    location /api/learning {
        proxy_pass http://learning_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
    location /api/writing-coach {
        proxy_pass http://writing_coach_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
    location /api/writing {
        proxy_pass http://writing_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
    location /api/teacher {
        proxy_pass http://teacher_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
    location /api/emotion {
        proxy_pass http://emotion_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # BFF actuator 健康检查(门户诊断卡片用,bff 对 /api/* 有鉴权,/actuator/* 放行)
    location /api/actuator/ {
        rewrite ^/api/actuator/(.*)$ /actuator/$1 break;
        proxy_pass http://bff_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_connect_timeout 3s;
    }

    # /ws 反代到 gateway-go(WebSocket 长连接,需 upgrade 头)
    location /ws/ {
        proxy_pass http://gateway_backend;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
