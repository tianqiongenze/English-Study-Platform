# session_turns 分片灌数(16 分片 × 1 worker,断线重连版 v2)。
# 必须用 shard_count=16 以匹配已有 Redis 进度键 esp:ctx:seed:session_turns:shard:0..15(sid%16 分片)。
# 单节点 TiDB 止血:此前 16分片×4worker=64连接 OOM 重启16次 → 降为 16分片×1worker=16连接。
# 稳定后可 bump worker。v2 脚本断线无限重连(CONN_RETRY_MAX=999),TiDB 即使重启也能 resume。
apiVersion: v1
kind: ConfigMap
metadata:
  name: seed-session-turns-launch
  namespace: esp-prod
data:
  run.sh: |
    #!/bin/sh
    set -e
    pip install -q pymysql redis >/dev/null 2>&1 || true
    echo "[launch] shard=$SHARD_ID/$SHARD_COUNT target=$TARGET workers=$WORKERS"
    python3 /script/seed_session_turns_v2.py \
      --target "$TARGET" --shard-id "$SHARD_ID" --shard-count "$SHARD_COUNT" \
      --multi-batch 500 --commit-every 2 --workers "$WORKERS" --report-interval 30
---
apiVersion: v1
kind: Pod
metadata:
  name: st-seeder-0
  namespace: esp-prod
  labels:
    esp_app: st-seeder
    esp_shard: "0"
spec:
  restartPolicy: Never
  containers:
  - name: seeder
    image: python:3.13-slim
    env:
    - name: SHARD_ID
      value: "0"
    - name: SHARD_COUNT
      value: "16"
    - name: TARGET
      value: "300000000"
    - name: WORKERS
      value: "1"
    command: ["sh", "/launch/run.sh"]
    volumeMounts:
    - name: script
      mountPath: /script
    - name: launch
      mountPath: /launch
  volumes:
  - name: script
    configMap:
      name: seed-session-turns-v2
  - name: launch
    configMap:
      name: seed-session-turns-launch
      defaultMode: 0755
---
