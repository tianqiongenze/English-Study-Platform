apiVersion: apps/v1
kind: Deployment
metadata: {name: reading-go, namespace: esp-prod}
spec:
  replicas: 1              # S6 部署验证(单节点)
  selector: {matchLabels: {app: reading-go}}
  template:
    metadata: {labels: {app: reading-go}, annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8091", prometheus.io/path: "/metrics"}}
    spec:
      securityContext:              # Phase1 1.6: pod 级 fsGroup+seccompProfile
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: reading-go
        image: esp/reading-go:0.3.1   # #140 CRDB 切库:esp-common-go pgx + 方言迁移
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8091}]
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        env:
        - {name: PORT, value: "8091"}
        - {name: READ_DB_URL, value: "postgres://root@crdb-public:26257/esp_reading?sslmode=disable"}
        - {name: WRITE_DB_URL, value: "postgres://root@crdb-public:26257/esp_reading?sslmode=disable"}
        - {name: OTEL_SERVICE_NAME, value: "reading-go"}
        - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.esp-prod.svc.cluster.local:4317"}
        - {name: NACOS_ADDR, value: "nacos:8848"}
        startupProbe:   {httpGet: {path: /livez, port: 8091}, periodSeconds: 10, failureThreshold: 30, timeoutSeconds: 5}
        readinessProbe: {httpGet: {path: /readyz, port: 8091}, periodSeconds: 15, failureThreshold: 5, timeoutSeconds: 5}
        livenessProbe:  {httpGet: {path: /livez, port: 8091}, periodSeconds: 20, failureThreshold: 3, timeoutSeconds: 5}
        lifecycle:
          preStop:
            exec: {command: ["sh","-c","sleep 5"]}
        resources: {requests: {cpu: "100m", memory: 128Mi}, limits: {cpu: "500m", memory: 256Mi}}
        # RWP铁律(DGO回写):readOnlyRootFilesystem:true已开但无挂载=定时炸弹;
        # nacos-sdk-go/v2 默认写 ./log(相对 WORKDIR /app → /app/log)+ /tmp 临时文件,readOnly 下 mkdir /app/log 失败(read-only file system)。
        # 对标 learning-java/teacher-java 已修模式(emptyDir 挂 SDK 写路径);同形 mountPath 与 binary 实际写路径一致(CLC 追踪执行路径)。
        volumeMounts:
        - {name: app-log, mountPath: /app/log}
        - {name: tmp, mountPath: /tmp}
      # RWP铁律(必须修):emptyDir 供 nacos-sdk-go /app/log + 通用 /tmp 写入(fsGroup:1000 属主与 runAsUser:1000 一致)
      volumes:
      - {name: app-log, emptyDir: {}}
      - {name: tmp, emptyDir: {}}
      terminationGracePeriodSeconds: 30
---
