spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: gamification-go}
  minReplicas: 1
  maxReplicas: 4
  metrics:
  - type: Resource
    resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
