# esp-admin-go: 统一管理员监测门户聚合服务(全服务健康探活 + 基础设施探活 + Prometheus 只读代理 + API目录)
# 鉴权:role=admin 的 RS256 JWT(esp-rsa-jwt-verify 公钥注入,与 gateway-go 同签发)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: esp-admin
  namespace: esp-prod
  labels: {app: esp-admin}
spec:
  replicas: 1
  selector: {matchLabels: {app: esp-admin}}
  template:
    metadata: {labels: {app: esp-admin}}
    spec:
      containers:
      - name: esp-admin
        image: esp/admin-go:1.0.0
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8099}]
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
        env:
        - {name: PROMETHEUS_URL, value: "http://prometheus.esp-observability.svc.cluster.local:9090"}
        - {name: PORT, value: "8099"}
        envFrom:
        - secretRef: {name: esp-rsa-jwt-verify}
        readinessProbe: {httpGet: {path: /readyz, port: 8099}, initialDelaySeconds: 3, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3}
        livenessProbe: {httpGet: {path: /livez, port: 8099}, initialDelaySeconds: 10, periodSeconds: 15, timeoutSeconds: 3, failureThreshold: 5}
        resources:
          requests: {cpu: "50m", memory: "64Mi"}
          limits: {cpu: "500m", memory: "256Mi"}
---
apiVersion: v1
kind: Service
metadata: {name: esp-admin, namespace: esp-prod}
spec:
  selector: {app: esp-admin}
  ports: [{port: 80, targetPort: 8099}]
---
# NodePort 供本地/外部管理员直接访问监测 API
apiVersion: v1
kind: Service
metadata: {name: esp-admin-np, namespace: esp-prod}
spec:
  type: NodePort
  selector: {app: esp-admin}
  ports: [{port: 80, targetPort: 8099, nodePort: 30099}]
