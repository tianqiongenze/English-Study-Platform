# 45-httptest-nodeports.yaml
# 人工测试用 NodePort:让 Mac host 能直连各服务(单节点 Rancher Desktop)。
# Traefik Ingress 需 Host header(esp.example.com),NodePort 更直观,适合人工测试。
# 所有 NodePort 范围 30000-32767。
# P0-5 NodePort 收敛(2026-08-14):删除业务服务(learning/teacher/writing-py/emotion/writing-coach)对外 NodePort,
#   只保留必须对外暴露的:gateway-go 30080(WS/主入口)、bff 30009/30010(边缘)、前端 30090/30091/30070、调试 nacos/sentinel/seata。
#   业务服务改走内部 ClusterIP svc(20/30 yaml 已定义),公网仅 traefik ingress 暴露。
apiVersion: v1
kind: Service
metadata:
  name: bff-java-np
  namespace: esp-prod
  labels:
    app: bff-java
spec:
  type: NodePort
  selector:
    app: bff-java
  ports:
  - name: http
    port: 8090
    targetPort: 8090
    nodePort: 30009   # bff-java 8090 -> NodePort 30009(actuator/api-auth)
  - name: edge
    port: 9090
    targetPort: 9090
    nodePort: 30010   # bff Netty edge 9090
---
# P0-5 收敛:learning-java 对外 NodePort 已删除(改走 ClusterIP svc learning-java + traefik ingress)。
---
# P0-5 收敛:teacher-java 对外 NodePort 已删除(改走 ClusterIP svc teacher-java + traefik ingress)。
---
# P0-5 收敛:writing-py 对外 NodePort 已删除(改走 ClusterIP svc writing-py + traefik ingress)。
---
# P0-5 收敛:emotion-svc 对外 NodePort 已删除(改走 ClusterIP svc emotion-svc + traefik ingress)。
---
# P0-5 收敛:writing-coach 对外 NodePort 已删除(改走 ClusterIP svc writing-coach + traefik ingress)。
---
apiVersion: v1
kind: Service
metadata:
  name: nacos-np
  namespace: ekb-m2-aws-us-east-1   # 迁移(2026-08-16):SCA 三件套迁共享 ns,NodePort 跟随
  labels:
    app: nacos
spec:
  type: NodePort
  selector:
    app: nacos
  ports:
  - name: http
    port: 8848
    targetPort: 8848
    nodePort: 30048
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-np
  namespace: ekb-m2-aws-us-east-1   # 迁移(2026-08-16)
  labels:
    app: sentinel
spec:
  type: NodePort
  selector:
    app: sentinel
  ports:
  - name: http
    port: 8858
    targetPort: 8858
    nodePort: 30058
---
apiVersion: v1
kind: Service
metadata:
  name: seata-np
  namespace: ekb-m2-aws-us-east-1   # 迁移(2026-08-16)
  labels:
    app: seata
spec:
  type: NodePort
  selector:
    app: seata
  ports:
  - name: http
    port: 7091
    targetPort: 7091
    nodePort: 30071   # seata web console
  - name: tc
    port: 8091
    targetPort: 8091
    nodePort: 30092   # seata TC
