# ADR-08 Dubbo Triple RPC:测试环境禁用 Dubbo 自动启动 + 不校验注册中心
# (Nacos 不可达 / 无注册中心导致 WebMvcTest context 启动或 @DubboReference 解析失败)
dubbo.application.enable=false
dubbo.registry.address=N/A
dubbo.config-center.address=
dubbo.protocol.port=-1
dubbo.consumer.check=false
dubbo.reference.check=false
dubbo.annotation.enable=false
spring.autoconfigure.exclude=\
  org.apache.dubbo.spring.boot.autoconfigure.DubboRelaxedBinding2AutoConfiguration,\
  org.apache.dubbo.spring.boot.autoconfigure.DubboTripleAutoConfiguration

