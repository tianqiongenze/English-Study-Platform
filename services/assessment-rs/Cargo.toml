[package]
name = "assessment-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "assessment-rs"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["json", "tokio", "http1"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["trace", "cors"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# tidb (esp_assessment: assessment_sessions / assessment_answers)
sqlx = { version = "0.7", features = ["mysql", "runtime-tokio-rustls", "macros", "chrono"] }

# redis cluster (IRT θ 缓存 esp:assess:theta:{user_id})
redis = { version = "0.26", features = ["tokio-comp", "aio", "connection-manager", "cluster", "cluster-async"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
