# S2 vocab-srs-go —— 词汇间隔重复服务(Batch1 P0)
# ADR: docs/design/adr-new-services.md(§3 行45)
# PRD: docs/design/prd-new-services.md
# schema: docs/design/schema-per-service-phase0.sql 行57-88(esp_vocab.vocabulary / esp_vocab.user_vocabulary)
#
# 端口:8087;不暴露 NodePort(经 bff-java 路由)。
# 依赖:TiDB(tidb-primary 写 / tidb-follower 读,ExternalName 短名)+ Redis Cluster(预留,后续阶段接缓存)。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vocab-srs-go
  namespace: esp-prod
  labels:
    app: vocab-srs-go
    tier: new-service
    lang: go
spec:
  replicas: 1
  selector:
    matchLabels: {app: vocab-srs-go}
  template:
    metadata:
      labels: {app: vocab-srs-go, tier: new-service, lang: go}
    spec:
      containers:
      - name: vocab-srs-go
        image: esp/vocab-srs-go:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - {containerPort: 8087, name: http}
        env:
        - {name: PORT, value: "8087"}
        - {name: GIN_MODE, value: "release"}
        - {name: TIDB_HOST, value: "tidb-primary"}
        - {name: TIDB_HOST_READ, value: "tidb-follower"}
        - {name: TIDB_PORT, value: "4000"}
        - {name: TIDB_USER, value: "root"}
        - {name: TIDB_DB, value: "esp_vocab"}
        - {name: OTEL_SERVICE_NAME, value: "vocab-srs-go"}
        - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.esp-observability.svc.cluster.local:4317"}
        - {name: OTEL_EXPORTER_OTLP_PROTOCOL, value: "grpc"}
        startupProbe:
          httpGet: {path: /healthz, port: 8087}
          periodSeconds: 10
          failureThreshold: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet: {path: /readyz, port: 8087}
          periodSeconds: 15
          failureThreshold: 5
          timeoutSeconds: 5
        livenessProbe:
          httpGet: {path: /livez, port: 8087}
          periodSeconds: 20
          failureThreshold: 6
          timeoutSeconds: 5
        resources:
          requests: {cpu: "100m", memory: 128Mi}
          limits:   {cpu: "500m", memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: vocab-srs-go
  namespace: esp-prod
  labels: {app: vocab-srs-go}
spec:
  selector: {app: vocab-srs-go}
  ports:
  - {name: http, port: 80, targetPort: 8087}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vocab-srs-go
  namespace: esp-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vocab-srs-go
  minReplicas: 1
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target: {type: Utilization, averageUtilization: 70}
