        readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8090}, periodSeconds: 15, failureThreshold: 5, timeoutSeconds: 5}
        livenessProbe:  {httpGet: {path: /actuator/health/liveness, port: 8090}, periodSeconds: 20, failureThreshold: 3, timeoutSeconds: 5}
