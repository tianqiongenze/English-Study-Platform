# Ingress (Traefik): 统一入口。
# P0-3 IDOR 收敛(2026-08-14):所有 /api/** 业务流量收敛经 bff-java(单一鉴权入口)。
#   原 ingress 直连各后端(learning/writing-coach/writing-py/teacher/emotion),后端无鉴权,
#   公网可裸调 /api/emotion/recent/{user_id} 等越权接口。收敛后 bff EdgeAuthHandler 统一校验 JWT
#   并注入可信 X-User-Id/X-Role,后端只认 bff 注入的 header。
# WS 旁路 bff:浏览器 WS 不能设 Authorization header,走 gateway-go ?token= 自鉴权(见 main.go handleSpeech)。
# Traefik 自动支持 WebSocket 长连接(无需额外注解)。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: esp-ingress
  namespace: esp-prod
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    # P1-7 入口限流:traefik RateLimit middleware,按 source IP 全局速率闸。
    # 业务级细粒度限流由 bff-java Sentinel RateLimitFilter(api-learning-event/api-writing-grade)兜底。
    # averate=100 req/s,period=1s,burst=200(容 WS 握手/页面冷启动瞬时尖刺)。
    traefik.ingress.kubernetes.io/router.middlewares: esp-prod-esp-ratelimit@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: esp.example.com
    http:
      paths:
      # /api/auth/** 由 BFF 自身 AuthController 处理(签发 JWT)
      - path: /api/auth
        pathType: Prefix
        backend: {service: {name: bff-java, port: {number: 8090}}}
      # /graphql 路由到 bff-java spring-graphql(GraphQL Phase1,spring-graphql 2.0.4),
      # 供 k6 GraphQL 压测宿主可达(bff-java 是 ClusterIP 无 NodePort,/graphql 只能经 traefik ingress 暴露)。
      # bff-java spring-graphql 端点 http.path:/graphql 在 8090(与 /api/** 同 backend)。
      - path: /graphql
        pathType: Prefix
        backend: {service: {name: bff-java, port: {number: 8090}}}
      # WS 旁路 bff:gateway-go 用 ?token= 自鉴权(防越权连他人会话)
      - path: /ws/
        pathType: Prefix
        backend: {service: {name: gateway-go, port: {number: 80}}}
      # P0-3:其余所有 /api/** 收敛经 bff(鉴权 + 注入 X-User-Id/X-Role),bff RouteTable 再按前缀转发下游
      - path: /api/scenarios
        pathType: Prefix
        backend: {service: {name: bff-java, port: {number: 8090}}}
      - path: /api/sessions
        pathType: Prefix
        backend: {service: {name: bff-java, port: {number: 8090}}}
      - path: /api/learning
        pathType: Prefix
        backend: {service: {name: bff-java, port: {number: 8090}}}
      - path: /api/writing-coach
        pathType: Prefix
        backend: {service: {name: bff-java, port: {number: 8090}}}
      - path: /api/writing
        pathType: Prefix
        backend: {service: {name: bff-java, port: {number: 8090}}}
      - path: /api/teacher
        pathType: Prefix
        backend: {service: {name: bff-java, port: {number: 8090}}}
      - path: /api/emotion
        pathType: Prefix
        backend: {service: {name: bff-java, port: {number: 8090}}}
      - path: /api/content
        pathType: Prefix
        backend: {service: {name: bff-java, port: {number: 8090}}}
      - path: /api/community
        pathType: Prefix
        backend: {service: {name: bff-java, port: {number: 8090}}}
      - path: /api/gamification
        pathType: Prefix
        backend: {service: {name: bff-java, port: {number: 8090}}}
