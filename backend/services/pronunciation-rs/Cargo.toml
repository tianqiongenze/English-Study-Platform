[package]
name = "pronunciation-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pronunciation-rs"
path = "src/main.rs"

[dependencies]
# web framework
axum = { version = "0.7", features = ["json", "tokio", "http1"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# serde / json
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# tidb (esp_pronunciation: pronunciation_attempts / pronunciation_scores)
sqlx = { version = "0.7", features = ["mysql", "runtime-tokio-rustls", "macros", "chrono"] }

# redis cluster (评分缓存 esp:pron:{audio_ref})
# 必须开 cluster-async:ESP 用真 Redis Cluster(3 master 分片),单连接不处理 MOVED → 写静默失败。
redis = { version = "0.26", features = ["tokio-comp", "aio", "connection-manager", "cluster", "cluster-async"] }

# tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# esp 公共库(tracing init / db / redisx / health)
esp-common-rs = { path = "../../shared/esp-common-rs" }

# misc
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
