# P2-4 OTel Collector Gateway(中心层)— 接收所有边缘 DaemonSet 流,按 backend 分流
#
# 单节点 RD 不 apply(与现有单层 otel-collector Deployment 等价)。
# 迁移多节点后:先 apply 本 Gateway,再 apply DaemonSet。详见 docs/design/p2-4-otel-collector-tiering.md。
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-gateway-config
  namespace: esp-observability
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        timeout: 5s
        send_batch_size: 2048
      resource:
        attributes:
          - key: deployment.environment
            value: esp-prod
            action: upsert
    exporters:
      otlp/tempo:
        endpoint: tempo.esp-observability.svc.cluster.local:4317
        tls:
          insecure: true
      loki:
        endpoint: http://loki.esp-observability.svc.cluster.local:3100/loki/api/v1/push
        default_labels_enabled:
          exporter: false
          job: true
      prometheus:
        endpoint: 0.0.0.0:8889
        send_timestamps: true
        metric_expiration: 5m
        resource_to_telemetry_conversion:
          enabled: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [otlp/tempo]
        logs:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [loki]
        metrics:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [prometheus]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector-gateway
  namespace: esp-observability
spec:
  replicas: 2                           # 高可用 2 副本 + 反亲和
  selector: {matchLabels: {app: otel-collector-gateway}}
  template:
    metadata: {labels: {app: otel-collector-gateway}}
    spec:
      affinity:
        podAntiAffinity:                # 2 副本分布不同节点,避免单点
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels: {app: otel-collector-gateway}
            topologyKey: kubernetes.io/hostname
      securityContext:                    # Phase1 1.6: pod 级 seccompProfile + fsGroup
        fsGroup: 10001                     # 镜像 USER=10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: collector
        image: otel/opentelemetry-collector-contrib:0.110.0
        args: ["--config", "/etc/otelcol/config.yaml"]
        securityContext:                  # 镜像 USER=10001 非 root
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        ports:
        - {containerPort: 4317, name: otlp-grpc}
        - {containerPort: 4318, name: otlp-http}
        - {containerPort: 8889, name: prom}
        volumeMounts:
        - {name: config, mountPath: /etc/otelcol, readOnly: true}
        - {name: tmp, mountPath: /tmp}
        resources:
          requests: {cpu: "200m", memory: 512Mi}
          limits: {cpu: "1", memory: 1Gi}
      volumes:
      - name: config
        configMap: {name: otel-collector-gateway-config}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector-gateway
  namespace: esp-observability
spec:
  selector: {app: otel-collector-gateway}
  ports:
  - {name: otlp-grpc, port: 4317, targetPort: 4317}
  - {name: otlp-http, port: 4318, targetPort: 4318}
