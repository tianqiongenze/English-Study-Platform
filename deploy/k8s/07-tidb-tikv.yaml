spec:
  selector: {app: tidb-cluster-tidb}
  ports:
    - {name: mysql, port: 4000, targetPort: 4000}
    - {name: status, port: 10080, targetPort: 10080}
---
# ============ Deployment: TiDB-aws(主写) ============
apiVersion: apps/v1
kind: Deployment
metadata: {name: tidb-cluster-tidb, namespace: ekb-m2-aws-us-east-1}
spec:
  replicas: 1
  selector: {matchLabels: {app: tidb-cluster-tidb}}
  template:
    metadata: {labels: {app: tidb-cluster-tidb, region: aws, role: primary}}
    spec:
      containers:
        - name: tidb
          image: pingcap/tidb:v8.5.7
          imagePullPolicy: IfNotPresent
          command: ["/tidb-server"]
          args:
            - --store=tikv
            - --path=pd-aws.ekb-m2-aws-us-east-1.svc.cluster.local:2379
            - --host=0.0.0.0
            - -P=4000
            - --status=10080
          ports: [{containerPort: 4000}, {containerPort: 10080}]
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: 1000m, memory: 1Gi}
          startupProbe:
            tcpSocket: {port: 4000}
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            tcpSocket: {port: 4000}
            periodSeconds: 15
            failureThreshold: 10
          readinessProbe:
            httpGet: {path: /status, port: 10080}
            periodSeconds: 5
---
