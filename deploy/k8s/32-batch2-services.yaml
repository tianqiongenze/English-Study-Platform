metadata: {name: reading-go, namespace: esp-prod}
spec: {selector: {app: reading-go}, ports: [{port: 80, targetPort: 8091}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: reading-go, namespace: esp-prod}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: reading-go}
  minReplicas: 1
