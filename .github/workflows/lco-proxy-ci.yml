name: lco-proxy CI

on:
  push:
    paths:
      - 'tools/lco-proxy/**'
  pull_request:
    paths:
      - 'tools/lco-proxy/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/lco-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: tools/lco-proxy/go.sum
      - name: Set Go proxy (China mirror for CI speed)
        run: go env -w GOPROXY=https://goproxy.cn,direct
      - name: go vet (CLC 铁律门禁)
        run: go vet ./...
      - name: go build
        run: go build ./cmd/lco-proxy/
      - name: go test with coverage
        run: go test -cover ./...
      - name: golangci-lint (代码质量门禁)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: tools/lco-proxy
