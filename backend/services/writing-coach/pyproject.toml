[project]
name = "writing-coach"
version = "1.0.1"
description = "ESP Writing Coach: templates/essays recommendation, holistic grading, improvement plans"
requires-python = ">=3.11"
dependencies = [
    "litestar>=2.24.0",
    "granian>=1.6.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "anthropic>=0.120.0",
    # LCO Phase3 L3 知识图谱:Neo4j Python driver(6.2.0,ASV 已核实 API)
    "neo4j>=5.20,<7.0",
    "prometheus-client>=0.20.0",
    "msgspec>=0.18.0",
    "esp-cache-py>=1.0.0",
    "esp-db-py>=1.0.0",
    "opentelemetry-api>=1.30.0,<2.0",
    "opentelemetry-sdk>=1.30.0,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29",
    "opentelemetry-instrumentation-asgi>=0.49b0,<1.0",
    # Nacos 服务注册
    "nacos-sdk-python>=0.1.15,<1.0",
]
[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.6"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
