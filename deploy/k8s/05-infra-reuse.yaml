# 基础设施复用:ESP 租户通过 ExternalName 引用 platform-infra 平台底座入口层,
# 入口层再指向底层 TiDB/Redis/Pulsar/Milvus/Neo4j(见 05b-platform-infra-externalnames.yaml)。
# 二跳解耦:组件底层迁移只改 05b,ESP 侧零改动。多租户接入 SOP 见
# docs/design/platform-infra-multitenant.md §4。
---
# TiDB(读写分离:写主、读副本;单节点阶段同 svc 伪分离,多节点 scale tidb=2+ 后真分流)
apiVersion: v1
kind: Service
metadata:
  name: tidb-primary
  namespace: esp-prod
spec:
  type: ExternalName
  externalName: tidb.platform-infra.svc.cluster.local
---
apiVersion: v1
kind: Service
metadata:
  name: tidb-follower
  namespace: esp-prod
spec:
  type: ExternalName
  externalName: tidb-follower.platform-infra.svc.cluster.local
---
# Redis Cluster(会话/缓存/限流/跨会话运行态)
apiVersion: v1
kind: Service
metadata:
  name: redis-cluster
  namespace: esp-prod
spec:
  type: ExternalName
  externalName: redis-cluster.platform-infra.svc.cluster.local
---
# Apache Pulsar(事件总线)
apiVersion: v1
kind: Service
metadata:
  name: pulsar-broker
  namespace: esp-prod
spec:
  type: ExternalName
  externalName: pulsar.platform-infra.svc.cluster.local
---
# Milvus 向量库(阶段B 启用后接入;启用前 scale=0 连接超时为预期)
apiVersion: v1
kind: Service
metadata:
  name: milvus
  namespace: esp-prod
spec:
  type: ExternalName
  externalName: milvus.platform-infra.svc.cluster.local
---
# Neo4j 图数据库(阶段B 启用后接入;启用前 scale=0 连接超时为预期)
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: esp-prod
spec:
  type: ExternalName
  externalName: neo4j.platform-infra.svc.cluster.local
---
# SCA 三件套(迁移自 esp-prod 原生 ClusterIP → ekb 共享 ns,2026-08-16)
# 客户端短名 nacos:8848 / sentinel:8858 / seata:8091 不变,应用零改动
apiVersion: v1
kind: Service
metadata:
  name: nacos
  namespace: esp-prod
spec:
  type: ExternalName
  externalName: nacos.platform-infra.svc.cluster.local
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel
  namespace: esp-prod
spec:
  type: ExternalName
  externalName: sentinel.platform-infra.svc.cluster.local
---
apiVersion: v1
kind: Service
metadata:
  name: seata
  namespace: esp-prod
spec:
  type: ExternalName
  externalName: seata.platform-infra.svc.cluster.local
