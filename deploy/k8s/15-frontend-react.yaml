# frontend-react: 前端静态托管(nginx)+ /api /ws 反代到集群 Ingress(Traefik)
# 前端容器不耦合具体后端 Service,反代到 Traefik(Host esp.example.com)由 Ingress 按 path 分发。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-react
  namespace: esp-prod
  labels: {app: frontend-react}
spec:
  replicas: 1
  selector: {matchLabels: {app: frontend-react}}
  template:
    metadata: {labels: {app: frontend-react}}
    spec:
      containers:
      - name: frontend-react
        image: esp/frontend-react:1.7.0   # 1.7.0 = AI 助手浮层(AIAssistant.tsx FloatButton+对话面板,App.tsx 全局挂载)+ i18n 9 语言(zh/en/ar/fr/ru/es/de/he/el + RTL,AntdProvider 9 locale)+ 9 美化页;1.6.0 = 深度美化(framer-motion 动效 + antd 重构核心页 + OpsPanel 3 新 Tab);派生构建 FROM 1.2.1 COPY dist+nginx.conf
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 80}]
        securityContext:
          allowPrivilegeEscalation: false   # nginx needs root for port80 + cache write; runAsNonRoot removed
        readinessProbe: {httpGet: {path: /, port: 80}, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3}
        livenessProbe:  {httpGet: {path: /, port: 80}, periodSeconds: 20, timeoutSeconds: 3, failureThreshold: 5}
        resources:
          requests: {cpu: "50m", memory: 64Mi}   # Phase2:32Mi 过紧致 OOMKilled/eviction,提至 64Mi
          limits: {cpu: "200m", memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: frontend-react, namespace: esp-prod}
spec:
  selector: {app: frontend-react}
  ports: [{port: 80, targetPort: 80}]
---
# NodePort 暴露前端供本地浏览器访问(连调用)
apiVersion: v1
kind: Service
metadata: {name: frontend-react-np, namespace: esp-prod}
spec:
  type: NodePort
  selector: {app: frontend-react}
  ports: [{port: 80, targetPort: 80, nodePort: 30090}]
