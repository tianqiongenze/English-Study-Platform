# ESP TiDB 多区域 TiKV 分布式栈(方案B:真多副本 Raft)
# 目标:验证多区域方案可行性,后续可直接移植到多节点服务器
# 拓扑(3 逻辑区域 ns,单物理节点模拟):
#   ekb-m2-aws-us-east-1     = region us-east-1
#   ekb-m2-azure-eastasia    = region azure-eastasia
#   ekb-m2-gcp-europe-west1  = region gcp-europe-west1
# PD 3 副本(每区域1个) + TiKV 3 副本(每区域1个) + TiDB 3(每区域1个) + TiFlash 1(aws)
# Raft 多数派:3 副本可容忍 1 副本故障
# 真正读写分离:tidb-primary(aws TiDB 写) / tidb-follower(azure/gcp TiDB 读)
# 内存预算(40GB 节点):PD 3*512Mi=1.5G + TiKV 3*3Gi=9G + TiDB 3*1Gi=3G + TiFlash 1*3Gi=3G ≈ 16.5G
---
# ============ PD:3 副本,每区域1个 ============
apiVersion: v1
kind: ConfigMap
metadata:
  name: pd-config
  namespace: ekb-m2-aws-us-east-1
data:
  start.sh: |
    #!/bin/sh
    exec /pd-server \
      --name=${PD_NAME} \
      --client-urls=http://0.0.0.0:2379 \
      --peer-urls=http://0.0.0.0:2380 \
      --advertise-client-urls=http://${PD_HOST}.ekb-m2-aws-us-east-1.svc.cluster.local:2379 \
      --advertise-peer-urls=http://${PD_HOST}.ekb-m2-aws-us-east-1.svc.cluster.local:2380 \
      --data-dir=/data \
      --initial-cluster=pd-aws=http://pd-aws.ekb-m2-aws-us-east-1.svc.cluster.local:2380,pd-azure=http://pd-azure.ekb-m2-azure-eastasia.svc.cluster.local:2380,pd-gcp=http://pd-gcp.ekb-m2-gcp-europe-west1.svc.cluster.local:2380
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pd-config
  namespace: ekb-m2-azure-eastasia
data:
  start.sh: |
    #!/bin/sh
    exec /pd-server \
      --name=${PD_NAME} \
      --client-urls=http://0.0.0.0:2379 \
      --peer-urls=http://0.0.0.0:2380 \
      --advertise-client-urls=http://${PD_HOST}.ekb-m2-azure-eastasia.svc.cluster.local:2379 \
      --advertise-peer-urls=http://${PD_HOST}.ekb-m2-azure-eastasia.svc.cluster.local:2380 \
      --data-dir=/data \
      --initial-cluster=pd-aws=http://pd-aws.ekb-m2-aws-us-east-1.svc.cluster.local:2380,pd-azure=http://pd-azure.ekb-m2-azure-eastasia.svc.cluster.local:2380,pd-gcp=http://pd-gcp.ekb-m2-gcp-europe-west1.svc.cluster.local:2380
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pd-config
  namespace: ekb-m2-gcp-europe-west1
data:
  start.sh: |
    #!/bin/sh
    exec /pd-server \
      --name=${PD_NAME} \
      --client-urls=http://0.0.0.0:2379 \
      --peer-urls=http://0.0.0.0:2380 \
      --advertise-client-urls=http://${PD_HOST}.ekb-m2-gcp-europe-west1.svc.cluster.local:2379 \
      --advertise-peer-urls=http://${PD_HOST}.ekb-m2-gcp-europe-west1.svc.cluster.local:2380 \
      --data-dir=/data \
      --initial-cluster=pd-aws=http://pd-aws.ekb-m2-aws-us-east-1.svc.cluster.local:2380,pd-azure=http://pd-azure.ekb-m2-azure-eastasia.svc.cluster.local:2380,pd-gcp=http://pd-gcp.ekb-m2-gcp-europe-west1.svc.cluster.local:2380
---
# ============ Services: PD ============
apiVersion: v1
kind: Service
metadata:
  name: pd-aws
  namespace: ekb-m2-aws-us-east-1
spec:
  selector: {app: pd-aws}
  ports:
    - {name: client, port: 2379, targetPort: 2379}
    - {name: peer, port: 2380, targetPort: 2380}
---
apiVersion: v1
kind: Service
metadata:
  name: pd-azure
  namespace: ekb-m2-azure-eastasia
spec:
  selector: {app: pd-azure}
  ports:
    - {name: client, port: 2379, targetPort: 2379}
    - {name: peer, port: 2380, targetPort: 2380}
---
apiVersion: v1
kind: Service
metadata:
  name: pd-gcp
  namespace: ekb-m2-gcp-europe-west1
spec:
  selector: {app: pd-gcp}
  ports:
    - {name: client, port: 2379, targetPort: 2379}
    - {name: peer, port: 2380, targetPort: 2380}
---
# ============ PVCs: PD ============
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: pd-aws-data, namespace: ekb-m2-aws-us-east-1}
spec: {accessModes: ["ReadWriteOnce"], resources: {requests: {storage: 5Gi}}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: pd-azure-data, namespace: ekb-m2-azure-eastasia}
spec: {accessModes: ["ReadWriteOnce"], resources: {requests: {storage: 5Gi}}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: pd-gcp-data, namespace: ekb-m2-gcp-europe-west1}
spec: {accessModes: ["ReadWriteOnce"], resources: {requests: {storage: 5Gi}}}
---
# ============ Deployment: PD-aws ============
apiVersion: apps/v1
kind: Deployment
metadata: {name: pd-aws, namespace: ekb-m2-aws-us-east-1}
spec:
  replicas: 1
  selector: {matchLabels: {app: pd-aws}}
  template:
    metadata: {labels: {app: pd-aws, region: aws}}
    spec:
      containers:
        - name: pd
          image: pingcap/pd:v8.5.7
          imagePullPolicy: IfNotPresent
          env:
            - {name: PD_NAME, value: pd-aws}
            - {name: PD_HOST, value: pd-aws}
          command: ["/bin/sh", "/start.sh"]
          ports: [{containerPort: 2379}, {containerPort: 2380}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: start, mountPath: /start.sh, subPath: start.sh}
          startupProbe:
            tcpSocket: {port: 2379}
            periodSeconds: 10
            failureThreshold: 120
          livenessProbe:
            tcpSocket: {port: 2379}
            periodSeconds: 30
            failureThreshold: 20
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: pd-aws-data}
        - name: start
          configMap: {name: pd-config, defaultMode: 0755}
---
apiVersion: apps/v1
