# PodDisruptionBudget — 应用服务自愿驱逐保护(架构评分 P0:缺 PDB)。
#
# 覆盖全部 24 个业务 Deployment。
# minAvailable 策略:
#   - 多副本服务(gateway-go/learning-java/teacher-java/writing-py/emotion-svc): minAvailable: 1
#     保证驱逐时至少保留 1 个可用副本。
#   - 单副本服务(其余): minAvailable: 0
#     不阻断滚动更新/drain,语义化标注"此服务有 PDB 保护意识但当前无法容忍驱逐"。
#     多节点扩至 ≥2 副本后改为 minAvailable: 1。
#
# 注意:单节点 + minAvailable:1 会使 kubectl drain 阻塞(无第二节点接纳);
# 这是预期行为(PDB 即"宁可 drain 失败也不可用")。多节点环境副本数 ≥2 时正常工作。
---
# ============ 核心服务(多副本,minAvailable: 1) ============
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-go-pdb
  namespace: esp-prod
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: gateway-go
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bff-java-pdb
  namespace: esp-prod
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: bff-java
---
