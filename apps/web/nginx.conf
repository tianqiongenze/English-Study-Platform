# frontend-react nginx:静态托管 SPA + /api 反代到集群内 Ingress 入口(Traefik via esp.example.com Host)
# 设计:前端容器不直接耦合具体后端 Service,而是反代到集群 Ingress Controller(Traefik),
# 由 Ingress 按 path 前缀路由到 gateway-go/bff-java/learning/teacher/writing/emotion。
# 这样前端与后端路由表解耦,符合 ADR-13(BFF 聚合 REST 鉴权,WS 旁路直连 gateway-go)。
#
# Traefik Ingress 监听 80(入口 web),按 Host esp.example.com + path 路由。
# 前端 /api/* → Traefik → 各服务;前端 /ws/* → Traefik → gateway-go。
#
# 集群内 Traefik Service 名 traefik(命名空间 traefik 或 kube-system),端口 80。
# 兜底:若 Ingress 不可达,可改反代到 bff-java:8090(REST) + gateway-go:80(WS)。

server {
    listen 80;
    server_name _;

    # 根路径直达(用户输入 localhost:30090)→ 跳 /web/ 挂载 SPA(BrowserRouter basename="/web")
    location = / {
        return 302 /web/;
    }

    # vite base='/web/' 静态资源 + SPA history 路由兜底
    location /web/ {
        alias /usr/share/nginx/html/web/;
        try_files $uri $uri/ /web/index.html;
    }

    # /api/admin 管理员监测门户 → esp-admin(统一聚合 API,先于通用 /api/ 前缀匹配)
    location /api/admin/ {
        proxy_pass http://esp-admin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_read_timeout 30s;
        proxy_connect_timeout 3s;
    }

    # /docs + /swagger-ui + /v3/api-docs —— API 在线测试(Swagger UI)反代到 bff-java。
    # AdminLayout "API 测试" Tab iframe src="/docs"(绝对路径,走 react 容器根,非 /web/)。
    # bff 已集成 springdoc-openapi,全就绪。同源自动带 esp_token httpOnly cookie。
    location /docs {
        proxy_pass http://bff-java:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_read_timeout 30s;
    }
    location /swagger-ui {
        proxy_pass http://bff-java:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_read_timeout 30s;
    }
    location /v3/api-docs {
        proxy_pass http://bff-java:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_read_timeout 30s;
    }

    # AI 助手对话:直连 gateway-go(自验 JWT + LCO 三层缓存),90s 超时。
    location /api/llm/ {
        proxy_pass http://gateway-go:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_read_timeout 90s;
    }

    # /api 反代到集群 Ingress(Traefik),由 Ingress 按 path 分发到各服务
    location /api/ {
        proxy_pass http://traefik.kube-system.svc.cluster.local:80;
        proxy_set_header Host esp.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # traceparent 透传(断点6:前端→BFF trace 贯通)
        proxy_pass_request_headers on;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # /ws 反代到 gateway-go(WebSocket 长连接,ADR-13 旁路)
    location /ws/ {
        proxy_pass http://traefik.kube-system.svc.cluster.local:80;
        proxy_set_header Host esp.example.com;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }
}
