[project]
name = "writing-coach"
version = "1.0.1"
description = "ESP Writing Coach: templates/essays recommendation, holistic grading, improvement plans"
requires-python = ">=3.11"
dependencies = [
    "litestar>=2.24.0",
    "granian>=1.6.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "anthropic>=0.120.0",
    "prometheus-client>=0.20.0",
    "msgspec>=0.18.0",
    "esp-cache-py>=1.0.0",
    "esp-db-py>=1.0.0",
    "opentelemetry-api>=1.30.0,<2.0",
    "opentelemetry-sdk>=1.30.0,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29",
    "opentelemetry-instrumentation-asgi>=0.49b0,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
