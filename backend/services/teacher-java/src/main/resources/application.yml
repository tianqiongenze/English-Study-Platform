server:
  port: 8083
  jetty:
    threads:
      max: 400          # 默认 200,单节点 VM 高负载下 Jetty acceptor/工作线程易耗尽致 hang(51 CLOSE_WAIT 堆积),放宽到 400 防线程池耗尽(联网方案防线)
      min: 50           # 保留最小工作线程,避免冷启动 accept 延迟
      idle-timeout: 60s # 空闲线程 60s 回收,防止僵尸线程占用
    acceptors: 2        # acceptor 线程数(默认 -1 自适应),显式 2 确保接受连接不阻塞
    selectors: 4        # selector 线程数(默认 -1),显式 4 与 CPU 核数相关,防 selector 卡死致 acceptor 堆积
spring:
  application:
    name: teacher-java
  threads:
    virtual:
      enabled: true   # SB4 全局虚拟线程(I/O 密集收益,2026-08-06 #6 开启)
  main:
    allow-bean-definition-overriding: true   # SCA seata starter 传递 spring-boot-webclient:4.0.0,其 CodecsAutoConfiguration 与 SB3.5.16 defaultCodecCustomizer bean 重名,允许覆盖消解
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        namespace: ${NACOS_NS:public}
        fail-fast: false        # Nacos 不可达时不阻塞启动(降级模式)
        watch:
          enabled: false        # 关闭 watch 减少重连风暴
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASH:sentinel:8858}
      datasource:
        flow:
          nacos:
            server-addr: ${NACOS_ADDR:nacos:8848}
            namespace: ${NACOS_NS:public}
            dataId: ${spring.application.name}-flow-rules
            groupId: SENTINEL_GROUP
            rule-type: flow
        degrade:
          nacos:
            server-addr: ${NACOS_ADDR:nacos:8848}
            namespace: ${NACOS_NS:public}
            dataId: ${spring.application.name}-degrade-rules
            groupId: SENTINEL_GROUP
            rule-type: degrade
  jpa:
    # CRDB 适配(会话22-29):dialect env 驱动 —— TiDB(缺省)MariaDBDialect 不变;
    # CRDB 模式设 JPA_DATABASE_PLATFORM=org.hibernate.dialect.CockroachDialect(Hibernate 7.2 内置)
    database-platform: ${JPA_DATABASE_PLATFORM:org.hibernate.dialect.MariaDBDialect}
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: ${JPA_DATABASE_PLATFORM:org.hibernate.dialect.MariaDBDialect}
        # DB吞吐优化(2026-08-15 会话22-27):批量写 saveAll 50条/往返 + 排序凑批
        # (方案 docs/design/db-access-throughput-optimization.md;坑㉖红线:禁findAll全表)
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: false
  datasource:
    write:
      jdbc-url: ${WRITE_DB_URL:jdbc:mysql://tidb:4000/esp?useSSL=false&allowPublicKeyRetrieval=true}
      username: ${DB_USER:root}
      password: ${DB_PASS:""}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        # DB吞吐优化(2026-08-15):30→20。虚拟线程下池=限流器,池超DB承载反致TiKV
        # region热点+RTT膨胀;20/池对5000 CCU有10x容量余量(见方案文档§2①)
        maximum-pool-size: 20
        minimum-idle: 5
    read:
      jdbc-url: ${READ_DB_URL:jdbc:mysql://tidb-follower:4000/esp?useSSL=false&allowPublicKeyRetrieval=true}
      username: ${DB_USER:root}
      password: ${DB_PASS:""}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 20   # 30→20,理由同上(读池同收敛)
        minimum-idle: 5
  data:
    redis:
      # Redis Cluster 模式(经 ExternalName redis-cluster → redis-cluster-new,3主3从)
      cluster:
        nodes: redis-cluster:6379
        max-redirects: 3
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
management:
  endpoints:
    web:
      exposure:
        # 全语言统一深度诊断面板(Step2):暴露 actuator 全 6 深度 endpoint + health/info/metrics/prometheus/caches。
        # 敏感 6 项(env/loggers/threaddump/heapdump/beans/mappings)由 esp-common-java DebugEndpointSecurityFilter
        # 强制 admin-role JWT(ASV:6 Endpoint 类在 SB4.0.7 actuator jar 已 javap 核实存在)。
        include: health,info,metrics,prometheus,caches,env,loggers,beans,threaddump,heapdump,mappings
  endpoint:
    health:
      probes:
        enabled: true   # 激活 readiness/liveness health group,k8s httpGet 探针用(根治 jetty acceptor hang 假 Ready)
      show-details: always
  health:
    sentinel:
      enabled: false   # sentinel dashboard 健康检查不稳,关闭避免拖垮整体 health=DOWN
    nacos-config:
      enabled: false   # nacos config gRPC 健康检查连 127.0.0.1:9848 噪声,discovery 已 UP,关闭避免拖垮

# Resilience4j 慢调用熔断(补充 Sentinel 流控):
#   dbSlowCall:滑窗 10 次调用中 80% 慢(>5s)则熔断,半开放态放 10 次探测。
resilience4j:
  circuitbreaker:
    instances:
      dbSlowCall:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 5s
        permittedNumberOfCallsInHalfOpenState: 10
        waitDurationInOpenState: 30s
  timelimiter:
    instances:
      dbSlowCall:
        timeoutDuration: 10s
# ADR-08 Dubbo Triple RPC(consumer,注册到 Nacos)
dubbo:
  application:
    name: teacher-java
    serialize-check-status: WARN
  protocol:
    name: tri
  registry:
    address: nacos://${NACOS_HOST:nacos}:8848?username=&password=&wait=false
    group: ${DUBBO_GROUP:esp}
  consumer:
    group: ${DUBBO_GROUP:esp}
    version: 1.0.0
    check: false
  scan:
    base-packages: com.esp.teacher.web

# Seata 分布式事务(TC 已部署 seata:8091;consumer 侧发起全局事务)
seata:
  enabled: ${SEATA_ENABLED:true}
  tx-service-group: esp_tx_group
  service:
    vgroup-mapping:
      esp_tx_group: default
    grouplist:
      default: ${SEATA_ADDR:seata:8091}   # 显式 TC 地址兜底:registry nacos 发现失败时仍可直连
  registry:
    type: file   # registry 用 file:直接从本地 service.vgroup-mapping + service.grouplist 读 TC 地址,绕开 nacos lookup 对 vgroupMapping 的强制 getConfig(nacos 路径在 SB4 下 SeataProperties 绑定时序不稳,致 ConfigNotFoundException)
  config:
    type: file   # config 用 file 读本地 vgroup-mapping(SCA starter 桥接 Spring Environment);nacos config client gRPC 在 SB4 下不稳
  data-source-proxy-mode: AT

# 多级缓存(esp-cache:L1 Caffeine + L2 Redis + Pulsar 跨实例失效广播)
# feature flag:false 时所有缓存代码走 no-op 直打 DB(回退安全)
esp:
  cache:
    enabled: ${CACHE_ENABLED:true}
    l1-spec: ${CACHE_L1_SPEC:maximumSize=10000,expireAfterWrite=60s}
    l2-ttl-seconds: ${CACHE_L2_TTL:300}
    empty-ttl-seconds: ${CACHE_EMPTY_TTL:30}
    long-ttl-seconds: ${CACHE_LONG_TTL:1800}
    double-delete-delay-ms: ${CACHE_DOUBLE_DELETE_DELAY:100}
  pulsar:
    service-url: ${PULSAR_URL:pulsar://pulsar-broker:6650}
    topic: ${PULSAR_CACHE_TOPIC:esp-cache-invalidate}
    consumer-enabled: ${PULSAR_CONSUMER_ENABLED:true}
  # 共用 Web 能力(esp-web-common):GlobalExceptionHandler 包范围 + AppLogClient service 名
  web:
    common:
      base-packages: com.esp.teacher
      app-log:
        service: teacher
        # CRDB 适配(会话22-29):teacher 的 AppLogClient 走路由池(连接 esp_teacher/esp_teaching),
        # app_logs 在 esp_shared —— esp-web-common 默认 SQL 已用两段式 esp_shared.app_logs
        # (TiDB/CRDB 均跨库可达),无需 shared 池;SQL 模板按 esp.rw.storage.type 自动选 JSON/JSONB。
        # 如后续高频写 app_logs 需独立池,再仿 learning 引入 SharedDataSourceConfig +
        # jdbc-template-name: sharedJdbcTemplate(注意:引入自定义 JdbcTemplate 后须同时显式定义
        # 路由 jdbcTemplate bean,否则 SB 自动装配的 @Primary jdbcTemplate 会因 JdbcOperations 已存在而退避)。

# ADR-12 JWT 校验(D2 修复):RS256 公钥验 BFF 签发的 JWT。envFrom secret esp-rsa-jwt 注入。
jwt:
  rsa:
    public-key-pem: ${JWT_RSA_PUBLIC_KEY_PEM:}
