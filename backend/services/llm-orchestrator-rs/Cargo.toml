[package]
name = "llm-orchestrator-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "llm-orchestrator-rs"
path = "src/main.rs"

[dependencies]
# web framework
axum = { version = "0.7", features = ["json", "tokio", "http1"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower = "0.5"
tower-http = { version = "0.5", features = ["trace", "cors"] }
futures-util = "0.3"

# serde / json
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# http client (LLM provider 调用 + SSE 流式)
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }

# redis (语义缓存 L2 + session 状态)
# 必须开 cluster-async 特性:ESP 用真 Redis Cluster(3 master 分片),单连接 ConnectionManager
# 不处理 MOVED 重定向 → 写命令(SETEX/ZADD/SET NX)静默失败被 .ok() 吞 → 缓存/幂等永不回写。
# cluster-async 启用 ClusterClient + cluster_async::ClusterConnection,自动跟随 MOVED/ASK。
# 注意:feature 名是 "cluster-async"(依赖 cluster + aio),不是 "cluster"(后者只含同步 cluster)。
redis = { version = "0.26", features = ["tokio-comp", "aio", "connection-manager", "cluster", "cluster-async"] }

# cockroachdb (esp_llm: llm_call_logs / dialogue_*) — #140 全服务切 CRDB
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-rustls", "macros", "chrono", "bigdecimal"] }

# tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# esp 公共库(tracing init / db / redisx / health)
esp-common-rs = { path = "../../shared/esp-common-rs" }

# misc
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
once_cell = "1"

[profile.release]
opt-level = 3
