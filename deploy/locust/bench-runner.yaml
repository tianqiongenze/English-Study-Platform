# 基准执行 runner(压测+探测+预签 JWT)。esp-locust 镜像含 python3+locust+openssl。
# 复用 locust-runner 模式:保持 sleep 存活,exec 进去跑 locust_fullbench / probe / mint。
# JWT:从 esp-rsa-jwt-sign 注入 RS256 私钥。
apiVersion: v1
kind: Pod
metadata:
  name: bench-runner
  namespace: esp-prod
  labels: {app: bench-runner}
spec:
  restartPolicy: Never
  containers:
    - name: bench
      image: esp-locust:2.46
      imagePullPolicy: IfNotPresent
      command: ["sleep", "7200"]
      env:
        - name: JWT_RSA_PRIVATE_KEY_PEM
          valueFrom:
            secretKeyRef: {name: esp-rsa-jwt-sign, key: JWT_RSA_PRIVATE_KEY_PEM}
        - name: ESP_JWT_SECRET
          valueFrom:
            secretKeyRef: {name: esp-secrets, key: JWT_SECRET}
        - name: LOCUST_HOST
          value: "http://traefik.kube-system.svc.cluster.local:80"
      volumeMounts:
        - name: scripts
          mountPath: /bench
          readOnly: true
      resources:
        requests: {cpu: "100m", memory: 256Mi}
        limits: {cpu: "1", memory: 1Gi}
  volumes:
    - name: scripts
      configMap: {name: bench-scripts}
