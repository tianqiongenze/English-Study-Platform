---
# ============ TiFlash(aws 区域,列存 OLAP) ============
apiVersion: v1
kind: ConfigMap
metadata: {name: tiflash-config, namespace: ekb-m2-aws-us-east-1}
data:
  config.toml: |
    log_level = "info"
    display_name = "tiflash-aws"
    tcp_port = 9000
    http_port = 8123
    [raft]
    pd_endpoints = "pd-aws.ekb-m2-aws-us-east-1.svc.cluster.local:2379"
    [storage]
    [storage.main]
    dir = ["/data"]
    [tiflash]
    [status]
    http_port = 20292
---
apiVersion: v1
kind: Service
metadata: {name: tiflash, namespace: ekb-m2-aws-us-east-1}
spec:
  selector: {app: tiflash}
  ports:
    - {name: raft, port: 20170, targetPort: 20170}
    - {name: proxy, port: 20171, targetPort: 20171}
    - {name: status, port: 20292, targetPort: 20292}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: tiflash-data, namespace: ekb-m2-aws-us-east-1}
spec: {accessModes: ["ReadWriteOnce"], resources: {requests: {storage: 10Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: tiflash, namespace: ekb-m2-aws-us-east-1}
spec:
  replicas: 1
  selector: {matchLabels: {app: tiflash}}
  template:
    metadata: {labels: {app: tiflash, region: aws}}
    spec:
      containers:
        - name: tiflash
          image: pingcap/tiflash:v8.5.5
          imagePullPolicy: IfNotPresent
          command: ["/tiflash/tiflash"]
          args:
            - server
            - --config-file=/etc/tiflash/config.toml
          ports: [{containerPort: 20170}, {containerPort: 20171}, {containerPort: 20292}]
          resources:
            requests: {cpu: 200m, memory: 1Gi}
            limits: {cpu: 1500m, memory: 3Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /etc/tiflash}
          startupProbe:
            tcpSocket: {port: 9000}
            periodSeconds: 15
            failureThreshold: 80
          livenessProbe:
            tcpSocket: {port: 9000}
            periodSeconds: 30
            failureThreshold: 10
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: tiflash-data}
        - name: config
          configMap: {name: tiflash-config}
---
