[project]
name = "writing-py"
version = "1.0.0"
description = "English-Study-Platform writing & grading AI service (Litestar + Granian)"
requires-python = ">=3.11"
dependencies = [
    "litestar>=2.24.0",
    "granian>=1.6.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "anthropic>=0.120.0",
    "prometheus-client>=0.20.0",
    "msgspec>=0.18.0",
    "langgraph>=1.0",
    "langgraph-checkpoint>=1.0",
    # 多级缓存:公共包 esp-cache-py(L1 cachetools + L2 redis.asyncio)
    "esp-cache-py>=1.0.0",
    # 读写分离数据访问:公共包 esp-db-py(asyncpg,CRDB crdb-public:26257)+ 直连 psycopg(app_logs)
    "esp-db-py>=1.0.0",
    "psycopg[binary]>=3.1",
    # OpenTelemetry (tracing → OTel Collector via OTLP gRPC)
    # 松绑:原 ==1.30.0 精确锁版与 langgraph>=1.0 / litestar 间接依赖 ResolutionImpossible。
    # 改为兼容范围,允许 resolver 选择与 langgraph 1.x / litestar 2.x 共存的 OTel 版本。
    "opentelemetry-api>=1.30.0,<2.0",
    "opentelemetry-sdk>=1.30.0,<2.0",
    "opentelemetry-exporter-otlp>=1.30.0,<2.0",
    # OTel 自动埋点:Litestar 2.x 内置 OpenTelemetryPlugin(litestar.contrib.opentelemetry),
    # PyPI 上 opentelemetry-instrumentation-litestar 无真实发布,故不单独依赖。
    "opentelemetry-instrumentation-asgi>=0.49b0,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.6"]
# EDA: writing.graded 事件(Pulsar)。pulsar-client 无 arm64/cp313 预编译 wheel,
# 列为可选——默认 build 不装(运行时 PULSAR_ENABLED=false 降级 no-op);
# amd64 环境启用 EDA 时 `pip install ".[eda]"`。
eda = ["pulsar-client>=3.5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
