[package]
name = "media-learn-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "media-learn-rs"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["json", "tokio", "http1"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tracing = "0.1"
# governor 令牌桶限流(替代手写 AtomicU64)
governor = "0.8"
# esp 公共库(tracing init / db / redisx / health)
esp-common-rs = { path = "../../shared/esp-common-rs" }

[profile.release]
opt-level = 3
