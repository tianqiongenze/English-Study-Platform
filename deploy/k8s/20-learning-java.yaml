# learning-java: 自适应学习业务面 + Disruptor 异步入队
apiVersion: apps/v1
kind: Deployment
metadata:
  name: learning-java
  namespace: esp-prod
spec:
  replicas: 1              # 单节点 RD 资源紧张,JVM 服务暂缩 1 副本(原 3);多节点生产再扩
  selector: {matchLabels: {app: learning-java}}
  template:
    metadata: {labels: {app: learning-java}, annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8081", prometheus.io/path: "/actuator/prometheus"}}
    spec:
      securityContext:              # Phase1 1.6: pod 级 fsGroup+seccompProfile
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: learning-java
        image: esp/learning-java:1.13.4   # 1.13.4 = P1-D21(2026-08-21)冷启动优化JAVA_OPTS(G1GC+TieredStopAtLevel=1+Xshare:auto+gRPC超时3s→8s,与bff/teacher统一,bff实测151s→23s);1.13.3=gap2 EER reportEvent publish→publishReliable(worker-split入口不再fire-and-forget静默丢);1.13.2=409兜底
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8081}, {containerPort: 50091}]
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
        env:
        - {name: ESP_ROLE, value: "api"}                       # P1-11: HTTP/Dubbo 入口角色
        - {name: ESP_DISRUPTOR_ENABLED, value: "false"}         # #131 worker-split:入口 publish-only,事件经 Pulsar 由 worker 消费落库(单节点一体化模式改 true)
        - {name: PULSAR_CONSUMER_ENABLED, value: "false"}       # P1-11 防循环:入口不订阅 LEARNING_EVENT_REPORT(否则入口发→入口收→reportEvent→再发,无限循环)
        # #140 全服务切 CRDB:数据访问层走 CockroachDB(稳定,替代单节点 TiKV region 不稳);读 esp_learning + app_logs(esp_shared)
        - {name: ESP_RW_STORAGE_TYPE,       value: "cockroachdb"}
        - {name: ESP_RW_COCKROACHDB_HOST,   value: "crdb-public"}
        - {name: ESP_RW_COCKROACHDB_READ_HOST, value: "crdb-public"}   # 单节点,follower-read 在连接参数层
        - {name: ESP_RW_COCKROACHDB_PORT,   value: "26257"}
        - {name: ESP_RW_COCKROACHDB_DB,     value: "esp_learning"}
        - {name: ESP_RW_COCKROACHDB_SHARED_DB, value: "esp_shared"}   # app_logs 跨 schema
        - {name: ESP_RW_COCKROACHDB_USER,   value: "root"}
        - {name: WRITE_DB_URL, value: "jdbc:mysql://tidb-primary:4000/esp_learning?useSSL=false&allowPublicKeyRetrieval=true"}   # 可回切保留
        - {name: READ_DB_URL, value: "jdbc:mysql://tidb-follower:4000/esp_learning?useSSL=false&allowPublicKeyRetrieval=true"}   # 可回切保留
        # app_logs 跨 schema:app_logs 在 esp_shared,业务读写指 esp_learning,独立连接池写/读 app_logs
        - {name: SHARED_DB_URL, value: "jdbc:mysql://tidb-primary:4000/esp_shared?useSSL=false&allowPublicKeyRetrieval=true"}   # 可回切保留
        - {name: DB_USER, value: "root"}
        - {name: DB_PASS, value: ""}
        - {name: REDIS_HOST, value: "redis-cluster"}
        - {name: NACOS_HOST, value: "nacos"}
        - {name: DUBBO_GROUP, value: "esp"}
        # OTel 注入(ADR-observability-rebuild):javaagent 已在镜像 JAVA_OPTS 中(Dockerfile ENTRYPOINT)
        - {name: OTEL_SERVICE_NAME, value: "learning"}
        - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.esp-prod.svc.cluster.local:4317"}
        - {name: OTEL_TRACES_EXPORTER, value: "otlp"}
        envFrom:
        - secretRef: {name: esp-rsa-jwt-verify}   # P0-1 私钥收敛:仅校验,只注入公钥
        startupProbe:   {httpGet: {path: /actuator/health/readiness, port: 8081}, periodSeconds: 10, failureThreshold: 60, timeoutSeconds: 10}   # 最多等 600s 启动(TiDB 高负载下慢启动保护);用 readiness group 端点
        readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8081}, periodSeconds: 30, failureThreshold: 3, timeoutSeconds: 10}   # period 放宽到 30s 减少 kubelet 探针 CLOSE_WAIT 堆积(单节点 VM 通病诱因)
        livenessProbe:  {httpGet: {path: /actuator/health/liveness, port: 8081}, periodSeconds: 30, failureThreshold: 3, timeoutSeconds: 15}    # timeout 15s 容忍单节点 VM GC 抖动,acceptor hang 时自愈重启
        # N-2 preStop graceful shutdown(optimization-plan C-3):Disruptor RingBuffer drain + Pulsar consumer unsubscribe,
        # 配合 terminationGracePeriodSeconds=45 给 in-flight 事件落库,避免 rollout 丢字段。
        lifecycle:
          preStop:
            exec: {command: ["sh","-c","sleep 15"]}
        resources:
          requests: {cpu: "200m", memory: 512Mi}
          limits: {cpu: "1", memory: 1536Mi}
        # RWP铁律(DGO回写):live已patch挂/logs+/.dubbo修复Dubbo3.3.6写/.dubbo+Nacos SDK硬编码/logs/nacos失败;回写yaml防apply重建丢挂载
        volumeMounts:
        - {name: nacos-logs, mountPath: /logs}
        - {name: dubbo-meta, mountPath: /.dubbo}
      # RWP铁律(DGO回写):emptyDir供Nacos /logs + Dubbo /.dubbo写入
      volumes:
      - {name: nacos-logs, emptyDir: {}}
      - {name: dubbo-meta, emptyDir: {}}
      terminationGracePeriodSeconds: 45
---
apiVersion: v1
kind: Service
metadata: {name: learning-java, namespace: esp-prod}
spec:
  selector: {app: learning-java}
  ports: [{port: 80, targetPort: 8081}]
