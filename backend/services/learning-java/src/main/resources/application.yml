server:
  port: 8081
  jetty:
    threads:
      max: 400          # 默认 200,单节点 VM 高负载下 Jetty 线程易耗尽致 hang,放宽到 400 防线程池耗尽(与 teacher 同构,联网方案防线)
      min: 50
      idle-timeout: 60s
    acceptors: 2
    selectors: 4
spring:
  application:
    name: learning-java
  threads:
    virtual:
      enabled: true   # SB4 全局虚拟线程(I/O 密集收益,2026-08-06 #6 开启)
  main:
    allow-bean-definition-overriding: true   # SCA seata starter 传递 spring-boot-webclient:4.0.0,其 CodecsAutoConfiguration 与 SB3.5.16 defaultCodecCustomizer bean 重名,允许覆盖消解
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        namespace: ${NACOS_NS:public}
        fail-fast: false        # Nacos 不可达时不阻塞启动(降级模式)
        watch:
          enabled: false        # 关闭 watch 减少重连风暴
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASH:sentinel:8858}
      datasource:
        flow:
          nacos:
            server-addr: ${NACOS_ADDR:nacos:8848}
            namespace: ${NACOS_NS:public}
            dataId: ${spring.application.name}-flow-rules
            groupId: SENTINEL_GROUP
            rule-type: flow
        degrade:
          nacos:
            server-addr: ${NACOS_ADDR:nacos:8848}
            namespace: ${NACOS_NS:public}
            dataId: ${spring.application.name}-degrade-rules
            groupId: SENTINEL_GROUP
            rule-type: degrade
  jpa:
    # CRDB 适配(会话22-29):dialect env 驱动 —— TiDB(缺省)MariaDBDialect 不变;
    # CRDB 模式设 JPA_DATABASE_PLATFORM=org.hibernate.dialect.CockroachDialect(Hibernate 7.2 内置)
    database-platform: ${JPA_DATABASE_PLATFORM:org.hibernate.dialect.MariaDBDialect}
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: ${JPA_DATABASE_PLATFORM:org.hibernate.dialect.MariaDBDialect}
        # DB吞吐优化(2026-08-15 会话22-27,方案见 docs/design/db-access-throughput-optimization.md):
        # 批量写:saveAll 逐条→50条/往返,写路径 DB 往返降~50x;order_* 同类型实体排序凑批。
        # 红线(坑㉖):禁 findAll 千万行全表,业务去重用投影查询。
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: false
  datasource:
    write:
      jdbc-url: ${WRITE_DB_URL:jdbc:mysql://tidb:4000/esp?useSSL=false&allowPublicKeyRetrieval=true}
      username: ${DB_USER:root}
      password: ${DB_PASS:""}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        # DB吞吐优化(2026-08-15):50→20。虚拟线程下池=天然限流器,池超DB承载只会把排队
        # 转移到TiDB/TiKV内部(锁等待+region热点+RTT膨胀,坑㉑)。20/池=2k~4k QPS容量,
        # 对5000 CCU(落DB~250 QPS)有10x余量;多节点迁移靠副本数放大而非加大池。
        maximum-pool-size: 20
        minimum-idle: 5
    read:
      jdbc-url: ${READ_DB_URL:jdbc:mysql://tidb-follower:4000/esp?useSSL=false&allowPublicKeyRetrieval=true}
      username: ${DB_USER:root}
      password: ${DB_PASS:""}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 20   # 50→20,理由同上(读池同收敛,防瞬时百连接打满TiDB)
        minimum-idle: 5
        # P2-6: 从库连接初始化时设 tidb_read_consistency=strong(TiDB 6.5+),
        # 让 follower 读强制读最新已提交版本,作为应用层 consistent=true 之外的兜底,
        # 缩窄 follower lag 导致的读后写窗口。主库连接无需此设置(本就是最新)。
        connection-init-sql: "SET SESSION tidb_read_consistency='strong'"
    # app_logs 跨 schema 专用数据源(schema-per-service:app_logs 在 esp_shared,
    # 业务读写分离连接指 esp_learning,需独立连接池供 AppLogClient 写 / BehaviorController 读 app_logs)。
    # 仅 TiDB 模式生效(esp.rw.storage.type=tidb/缺省);CRDB 模式下 SharedDataSourceConfig
    # 改用 esp.rw.cockroachdb.*(host/user 默认 crdb-public:26257)派生 PG 连接指向 esp_shared,本段不生效。
    shared:
      jdbc-url: ${SHARED_DB_URL:jdbc:mysql://tidb-primary:4000/esp_shared?useSSL=false&allowPublicKeyRetrieval=true}
      username: ${DB_USER:root}
      password: ${DB_PASS:""}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
  data:
    redis:
      # Redis Cluster 模式(经 ExternalName redis-cluster → redis-cluster-new,3主3从)
      cluster:
        nodes: redis-cluster:6379
        max-redirects: 3
      # Lettuce 连接池:多副本下 L2 命中率高,池化复用连接
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
# 多级缓存(L1 Caffeine + L2 Redis + Pulsar 跨实例失效广播,ADR-多级缓存)
esp:
  cache:
    # feature flag:false 时所有缓存代码走 no-op 直打 DB(回退安全)
    enabled: ${CACHE_ENABLED:true}
    # L1 Caffeine spec:maxSize 1w / 写后 60s 过期(TTL 兜底防 Pub/Sub 丢消息)
    l1-spec: ${CACHE_L1_SPEC:maximumSize=10000,expireAfterWrite=60s}
    # L2 Redis TTL(默认 5min)
    l2-ttl-seconds: ${CACHE_L2_TTL:300}
    # 空结果缓存 TTL(防穿透,30s)
    empty-ttl-seconds: ${CACHE_EMPTY_TTL:30}
    # 聚合类长 TTL(aggregateByUser 低频重查询,30min)
    long-ttl-seconds: ${CACHE_LONG_TTL:1800}
    # 延迟双删间隔(ms)
    double-delete-delay-ms: ${CACHE_DOUBLE_DELETE_DELAY:100}
  pulsar:
    service-url: ${PULSAR_URL:pulsar://pulsar-broker:6650}
    topic: ${PULSAR_CACHE_TOPIC:esp-cache-invalidate}
    # consumer 启用开关(测试/单实例可关)
    consumer-enabled: ${PULSAR_CONSUMER_ENABLED:true}
  disruptor:
    buffer-size: 65536
    batch-size: 200
    flush-interval-ms: 500
    consumers: 4
    # G-06:独立 DB writer 线程池 + 有界批次队列(consumer 线程只入队,writer 异步 batchUpdate)
    writers: 4
    writer-queue: 100
  # 共用 Web 能力(esp-web-common):GlobalExceptionHandler 包范围 + AppLogClient service 名/DB 连接
  web:
    common:
      base-packages: com.esp.learning
      app-log:
        service: learning
        # app_logs 在 esp_shared 跨 schema 专用连接(见 config/SharedDataSourceConfig),非业务主库
        jdbc-template-name: sharedJdbcTemplate
# ADR-08 Dubbo Triple RPC(注册到 Nacos)
dubbo:
  application:
    name: learning-java
    serialize-check-status: WARN
  protocol:
    name: tri
    port: 50091
  registry:
    address: nacos://${NACOS_HOST:nacos}:8848?username=&password=&wait=false
    group: ${DUBBO_GROUP:esp}
  provider:
    group: ${DUBBO_GROUP:esp}
    version: 1.0.0
  scan:
    base-packages: com.esp.learning.rpc

# Seata 分布式事务(TC 已部署 seata:8091;provider 侧参与全局事务回滚)
seata:
  enabled: ${SEATA_ENABLED:true}
  tx-service-group: esp_tx_group
  service:
    vgroup-mapping:
      esp_tx_group: default
    grouplist:
      default: ${SEATA_ADDR:seata:8091}   # 显式 TC 地址兜底:registry nacos 发现失败时仍可直连
  registry:
    type: file   # registry 用 file:直接从本地 service.vgroup-mapping + service.grouplist 读 TC 地址,绕开 nacos lookup 对 vgroupMapping 的强制 getConfig(nacos 路径在 SB4 下 SeataProperties 绑定时序不稳,致 ConfigNotFoundException)
  config:
    type: file   # config 用 file 读本地 vgroup-mapping(SCA starter 桥接 Spring Environment);nacos config client gRPC 在 SB4 下不稳
  data-source-proxy-mode: AT
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,caches
  endpoint:
    health:
      probes:
        enabled: true   # 激活 readiness/liveness health group,k8s httpGet 探针用(与 teacher 同构,根治 jetty hang 假 Ready)
      show-details: always
  health:
    sentinel:
      enabled: false   # sentinel dashboard 健康检查不稳,关闭避免拖垮整体 health=DOWN
    nacos-config:
      enabled: false   # nacos config gRPC 健康检查连 127.0.0.1:9848 噪声,discovery 已 UP,关闭避免拖垮
    pulsar:
      enabled: false   # Pulsar 连接不稳定时不应拉垮综合 health(2026-08-17 修复 learning-worker 503)
    diskspace:
      enabled: false   # 容器内磁盘空间检查无意义,关闭

# Resilience4j 慢调用熔断(补充 Sentinel 流控):
#   Sentinel 按 QPS/异常比例做网关级流控,Resilience4j 按慢调用持续时间做 DB 访问级熔断。
#   dbSlowCall:滑窗 10 次调用中 80% 慢(>5s)则熔断,半开放态放 10 次探测。
#   slowCallDurationThreshold 5s 对齐 TiDB/CRDB P99 SLA。
resilience4j:
  circuitbreaker:
    instances:
      dbSlowCall:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 5s
        permittedNumberOfCallsInHalfOpenState: 10
        waitDurationInOpenState: 30s
  timelimiter:
    instances:
      dbSlowCall:
        timeoutDuration: 10s

# JWT RS256(ADR-12):learning-java 公钥校验 BFF 签发的 JWT
jwt:
  rsa:
    public-key-pem: ${JWT_RSA_PUBLIC_KEY_PEM:}
