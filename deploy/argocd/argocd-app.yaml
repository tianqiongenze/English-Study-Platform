# ArgoCD GitOps App —— ESP 全服务声明式同步
# 仓库:https://github.com/tianqiongenze/English-Study-Platform(私有,凭证见 secret github-repo-creds)
# 策略:automated prune + selfHeal,master 分支 deploy/k8s 目录全量同步到 esp-prod/argocd ns
# 单节点 RD:syncPolicy.automated 开启,但先 manual sync 一次验证(避免 prune 误删现有资源)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: esp-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tianqiongenze/English-Study-Platform
    targetRevision: master
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: esp-prod
  syncPolicy:
    automated:
      prune: false        # 单节点 RD:先不自动 prune,避免误删现有 Running 资源
      selfHeal: true      # 手动改集群时自动拉回 git 状态
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true  # 处理大 CRD/共存字段
    - RespectManagedFields=true  # SSA:仅 reconcile argocd own 的字段,不与 k3s/控制器抢字段所有权
  # 3 个跨 ns(ekb-m2-aws-us-east-1)StatefulSet(pulsar-bk/pulsar-zk/redis-cluster-new)
  # 持续 OutOfSync 的根因(已实证会话22-31):
  #   ① kubectl diff git vs live = 空(git==live,无真实 drift);
  #   ② live STS metadata.managedFields 为空(count=0)——这些 STS 由 klipper/helm 历史安装,
  #      无 field-manager 认领字段,argocd SSA 无所依凭判定字段归属 → 把 K8s 默认填充字段
  #      (podManagementPolicy/revisionHistoryLimit/persistentVolumeClaimRetentionPolicy/
  #       updateStrategy/dnsPolicy/restartPolicy/schedulerName/securityContext/
  #       terminationGracePeriodSeconds)全当作 unowned → empty-diff OOS;
  #   ③ RespectManagedFields 依赖 managedFields 判归属,managedFields=0 时失效;
  #      IgnoreExtraneous 同理失效(argocd v3.5.0 已加注解验证不消除 OOS)。
  # 结论:结构性 SSA 限制,非配置问题。业务零影响(6+3+3 pod 全 Ready,集群正常)。
  # 真根治需把 3 共享 infra STS 移出 esp-platform 管辖范围(单独 Application 或裸 kubectl 管),
  # 单节点 RD 阶段不 warranted,留多节点移植时处理。此处 ignoreDifferences 仅作尽力缓解。
  ignoreDifferences:
  - group: apps
    kind: StatefulSet
    jsonPointers:
    - /spec/podManagementPolicy
    - /spec/revisionHistoryLimit
    - /spec/persistentVolumeClaimRetentionPolicy
    - /spec/updateStrategy
    - /spec/serviceName
    - /spec/template/metadata/annotations
    - /spec/template/metadata/labels
    - /spec/template/spec/dnsPolicy
    - /spec/template/spec/restartPolicy
    - /spec/template/spec/schedulerName
    - /spec/template/spec/securityContext
    - /spec/template/spec/terminationGracePeriodSeconds
    - /spec/template/spec/serviceAccountName
    - /spec/template/spec/affinity
    - /spec/template/spec/nodeSelector
