apiVersion: v1
kind: ConfigMap
metadata: {name: tikv-config, namespace: ekb-m2-aws-us-east-1}
data:
  tikv.toml: |
    [rocksdb]
    max-open-files = 256
    [raftdb]
    max-open-files = 256
    [server]
    status-port = 20180
    [storage.block-cache]
    capacity = "1GB"
