apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-cluster-data
  namespace: ekb-m2-aws-us-east-1
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cluster
  namespace: ekb-m2-aws-us-east-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-cluster
  template:
    metadata:
      labels:
        app: redis-cluster
    spec:
      securityContext:                # Phase1 1.6: pod 级 seccompProfile
        seccompProfile:
          type: RuntimeDefault
        # fsGroup/runAsNonRoot DEFERRED: redis:8.0-alpine 镜像 USER=""(root,实测 uid=0);
        # /data PVC 由 root 写,强制 runAsNonRoot 需 chown PVC + 改启动命令(复杂,多节点生产化时再补)。
      containers:
      - name: redis
        image: redis:8.0-alpine
        imagePullPolicy: IfNotPresent
        securityContext:            # Phase1 1.6: 仅 allowPrivilegeEscalation:false(root 镜像可加)
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        ports:
        - containerPort: 6379
          protocol: TCP
        args:
        - --appendonly
        - "yes"
        volumeMounts:
        - name: redis-data
          mountPath: /data
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          tcpSocket:
            port: 6379
          timeoutSeconds: 1
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-cluster-data
