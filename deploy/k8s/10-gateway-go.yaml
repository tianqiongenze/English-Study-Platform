# gateway-go: 实时口语陪练网关,无状态,HPA 按 CCU/CPU 扩缩
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-go
  namespace: esp-prod
  labels: {app: gateway-go}
spec:
  replicas: 1
  selector: {matchLabels: {app: gateway-go}}
  template:
    metadata: {labels: {app: gateway-go}, annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: "/metrics"}}
    spec:
      securityContext:              # Phase1 1.6: pod 级 fsGroup+seccompProfile(业务 pod 无 PVC,fsGroup 安全)
        fsGroup: 1000               # 与 container runAsUser:1000 一致,emptyDir 卷属主 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: gateway-go
        image: esp/gateway-go:1.15.2   # 1.15.2 = Task B-pilot:接 Sentinel-golang v1.0.4 动态限流(规则经 Nacos dataId=gateway-go-flow-rules 热加载,无需重启)+ AllowOrLimit 包裹 /api/llm/chat+/api/scenarios(限流返 429)+ Sentinel LogDir=/tmp+console logger(避 readOnly mkdir 失败)+ 空 content→ClearRules(删配置即解限)+ RWP emptyDir(/app/log+/tmp)+ Dockerfile ENV HOME=/home/app;1.15.1=console logger;1.15.0=初版;1.14.0=AI 助手链路
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8080}]
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        env:
        - {name: REDIS_ADDR, value: "redis-cluster:6379"}
        # Phase1 L1 LLM 缓存:conversation-go 的 newLLMRedisClient 读 REDIS_HOST/REDIS_PORT(默认 redis-cluster:6379,
        # 与 REDIS_ADDR 同一 ClusterClient 短名 ExternalName)。ESP_LLM_CACHE_ENABLED 默认 true。
        - {name: REDIS_HOST, value: "redis-cluster"}
        - {name: REDIS_PORT, value: "6379"}
        - {name: ESP_LLM_CACHE_ENABLED, value: "true"}
        # Phase2 L2 Milvus 语义缓存(cosine≥0.92)+ Phase3 L3 Neo4j 知识图谱(LCO 铁律三层完整)。
        # L2:endpoint host.lima.internal:15730/embed(minilm 384 维),pod 已验证可达;3s 超时降级不阻断。
        # L3:bolt://host.lima.internal:7687(Neo4j 下沉宿主 brew services,2026-08-20),凭据走 env(不硬编码进 git)。
        #   注:Neo4j 密码从 esp-secrets 取(避免明文进 git;单节点 dev 默认见 knowledge.go l3DefaultPassword)。
        - {name: ESP_LLM_L2_ENABLED, value: "true"}
        - {name: ESP_LLM_L3_ENABLED, value: "true"}
        - {name: MILVUS_ADDR, value: "milvus:19530"}
        - {name: EMBEDDING_URL, value: "http://host.lima.internal:15730/embed"}
        - {name: NEO4J_URL, value: "bolt://host.lima.internal:7687"}
        - {name: NEO4J_USER, value: "neo4j"}
        - {name: NEO4J_PASSWORD, valueFrom: {secretKeyRef: {name: esp-secrets, key: NEO4J_PASSWORD}}}
        # LLM 真实链路(上线达标 Phase0):gateway 数字人对话走 AnthropicProvider;经 CC Switch 代理
        - {name: ANTHROPIC_API_KEY, valueFrom: {secretKeyRef: {name: esp-secrets, key: ANTHROPIC_API_KEY}}}
        - {name: ANTHROPIC_BASE_URL, valueFrom: {secretKeyRef: {name: esp-secrets, key: ANTHROPIC_BASE_URL}}}
        - {name: ANTHROPIC_AUTH_TOKEN, valueFrom: {secretKeyRef: {name: esp-secrets, key: ANTHROPIC_AUTH_TOKEN}}}
        # ASR/TTS 真实引擎(去 mock,2026-08-19):conversation-go provider.go case "http" 分支,
        # 转发到 asr-adapter-go / tts-adapter-go 微服务(契约转换:ESP {chunks}/{text} ↔ Whisper multipart / edge-tts MP3)。
        # ASR_MODE/TTS_MODE=mock 仍保留为压测开关,生产 manifest 不设。
        # GPU/本地模型预留:未来 ANTHROPIC_BASE_URL 改指 http://host.lima.internal:11434 即可切 Ollama 本地模型(零代码改动)。
        - {name: ASR_MODE, value: "http"}
        - {name: ASR_ENDPOINT, value: "http://asr-adapter:80/transcribe"}
        - {name: TTS_MODE, value: "http"}
        - {name: TTS_ENDPOINT, value: "http://tts-adapter:80/synthesize"}
        - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: esp-secrets, key: JWT_SECRET}}}
        # CRDB esp_speaking(#140 全服务切 CRDB;统一层 db.ReadWriteDSN 双池:会话归档写库/场景加载读库,
        # 单端点同址 crdb-public,多区域阶段设 CRDB_READ_HOST 切 follower 零代码改动;AppLogClient 写 esp_shared)
        - {name: DB_ENABLED, value: "true"}
        - {name: CRDB_HOST, value: "crdb-public"}
        - {name: CRDB_PORT, value: "26257"}
        # OTel 注入(ADR-observability-rebuild):gateway-go 已内置 otel sdk(tracing.go),仅需 env
        - {name: OTEL_SERVICE_NAME, value: "gateway"}
        - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.esp-prod.svc.cluster.local:4317"}
        - {name: NACOS_ADDR, value: "nacos:8848"}
        envFrom:
        - secretRef: {name: esp-rsa-jwt-verify}   # P0-1 私钥收敛:仅校验,只注入公钥(防任一服务 RCE 伪造 admin JWT)
        # N-1 探针三分离(optimization-plan C-2):startupProbe 给 WS/gateway 慢启动 5min 宽容,
        # 防冷启动期 liveness 误杀(坑⑮);liveness/readiness 保持宽容(timeout≥3s period≥15s failureThreshold≥5)。
        startupProbe: {httpGet: {path: /livez, port: 8080}, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 30}
        readinessProbe: {httpGet: {path: /readyz, port: 8080}, initialDelaySeconds: 3, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3}
        livenessProbe: {httpGet: {path: /livez, port: 8080}, initialDelaySeconds: 10, periodSeconds: 15, timeoutSeconds: 3, failureThreshold: 5}
        # N-2 preStop graceful shutdown(optimization-plan C-3):WS 长连接 drain 15s,
        # 配合 terminationGracePeriodSeconds=45 给 hub.unregister + in-flight 帧发完,避免 rollout 502。
        lifecycle:
          preStop:
            exec: {command: ["sh","-c","sleep 15"]}
        resources:
          requests: {cpu: "100m", memory: "128Mi"}
          limits: {cpu: "1", memory: "512Mi"}
        # RWP(铁律②):readOnlyRootFilesystem=true 容器的 SDK/业务写路径必挂 emptyDir,
        # 否则写 /app/log、/tmp 失败(2026-08-21 与 reading-go 同构修)。镜像回写 yaml(DGO)。
        volumeMounts:
        - {name: app-log, mountPath: /app/log}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - {name: app-log, emptyDir: {}}
      - {name: tmp, emptyDir: {}}
      terminationGracePeriodSeconds: 45
---
apiVersion: v1
kind: Service
metadata: {name: gateway-go, namespace: esp-prod}
spec:
  selector: {app: gateway-go}
  ports: [{port: 80, targetPort: 8080}]
---
# 同时暴露 NodePort 供本地 Locust 压测直连(绕过 Ingress,降低压测自身瓶颈)
apiVersion: v1
kind: Service
metadata: {name: gateway-go-np, namespace: esp-prod}
spec:
  type: NodePort
  selector: {app: gateway-go}
  ports: [{port: 80, targetPort: 8080, nodePort: 30080}]
