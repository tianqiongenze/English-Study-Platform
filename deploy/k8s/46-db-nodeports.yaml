apiVersion: v1
kind: Service
metadata:
  name: db-crdb-np
  namespace: esp-crdb
  labels: {app: crdb-np, purpose: local-gui}
spec:
  type: NodePort
  selector: {app: crdb}
  ports:
    - {name: pg, port: 26257, targetPort: 26257, nodePort: 32627}
    - {name: http, port: 8080, targetPort: 8080, nodePort: 32628}
---
apiVersion: v1
kind: Service
metadata:
  name: db-tidb-np
  namespace: ekb-m2-aws-us-east-1
  labels: {app: tidb-np, purpose: local-gui}
spec:
  type: NodePort
  selector: {app: tidb-cluster-tidb}
  ports:
    - {name: mysql, port: 4000, targetPort: 4000, nodePort: 30200}
---
apiVersion: v1
kind: Service
metadata:
  name: db-redis-np
  namespace: ekb-m2-aws-us-east-1
  labels: {app: redis-np, purpose: local-gui}
spec:
  type: NodePort
  selector: {app: redis-cluster-new}
  ports:
    - {name: redis, port: 6379, targetPort: 6379, nodePort: 30201}