# S3 pronunciation-rs / S4 listening-go / S5 assessment-rs / S6 reading-go / S7 gamification-go
# —— 第二批 5 新服务 manifest(schema-per-service Phase1)
# ADR: docs/design/adr-new-services.md / PRD §三~§七 / schema esp_{pronunciation,listening,assessment,reading,gamification}
#
# 单节点 RD 策略:
#   S3 pronunciation-rs(P0) replicas=1 实跑
#   S4/S5/S6/S7(P1) replicas=0 scaffold 就绪,HPA min=1 待命多节点(deploy replicas=0 时 Pod 不起,HPA 不扩)
# 端口:S3=8088 / S4=8089 / S5=8090 / S6=8091 / S7=8092
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: pronunciation-rs, namespace: esp-prod}
spec:
  replicas: 1
  selector: {matchLabels: {app: pronunciation-rs}}
  template:
    metadata: {labels: {app: pronunciation-rs}, annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8088", prometheus.io/path: "/metrics"}}
    spec:
      securityContext:              # Phase1 1.6: pod 级 fsGroup+seccompProfile
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: pronunciation-rs
        image: esp/pronunciation-rs:0.3.0
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8088}]
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        env:
        - {name: PORT, value: "8088"}
        # CRDB esp_pronunciation(#140 全服务切 CRDB;tidb TIDB_* 残留仅探针兼容,代码读 WRITE_DB_URL/READ_DB_URL)
        - {name: TIDB_DB, value: "esp_pronunciation"}
        - {name: WRITE_DB_URL, value: "postgres://root@crdb-public:26257/esp_pronunciation?sslmode=disable"}
        - {name: READ_DB_URL, value: "postgres://root@crdb-public:26257/esp_pronunciation?sslmode=disable"}
        - {name: REDIS_CLUSTER, value: "redis://redis-cluster-new-0.redis-cluster-new.ekb-m2-aws-us-east-1.svc.cluster.local:6379"}
        - {name: OTEL_SERVICE_NAME, value: "pronunciation-rs"}
        - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.esp-prod.svc.cluster.local:4317"}
        # Nacos 服务注册(entrypoint 脚本 nacos-register.sh)
        - {name: NACOS_ADDR, value: "nacos:8848"}
        - {name: POD_IP, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
        startupProbe:   {httpGet: {path: /actuator/health/liveness, port: 8088}, periodSeconds: 10, failureThreshold: 30, timeoutSeconds: 5}
        readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8088}, periodSeconds: 15, failureThreshold: 5, timeoutSeconds: 5}
        livenessProbe:  {httpGet: {path: /actuator/health/liveness, port: 8088}, periodSeconds: 20, failureThreshold: 3, timeoutSeconds: 5}
        lifecycle:
          preStop:
            exec: {command: ["sh","-c","sleep 5"]}
        # RWP铁律(DGO回写):readOnlyRootFilesystem:true已开但无挂载=定时炸弹;
        # nacos-sdk-go 默认写 ./log=/app/log(对标 reading-go 已修模式),OTel/gRPC 可能写 /tmp。
        volumeMounts:
        - {name: app-log, mountPath: /app/log}
        - {name: tmp, mountPath: /tmp}
        resources: {requests: {cpu: "100m", memory: 128Mi}, limits: {cpu: "500m", memory: 256Mi}}
      volumes:
      - {name: app-log, emptyDir: {}}
      - {name: tmp, emptyDir: {}}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata: {name: pronunciation-rs, namespace: esp-prod}
spec: {selector: {app: pronunciation-rs}, ports: [{port: 80, targetPort: 8088}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: pronunciation-rs, namespace: esp-prod}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: pronunciation-rs}
  minReplicas: 1
  maxReplicas: 4
  metrics:
  - type: Resource
    resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
