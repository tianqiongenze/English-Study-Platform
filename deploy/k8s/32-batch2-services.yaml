        - {name: WRITE_DB_URL, value: "root:@tcp(tidb-primary:4000)/esp_reading?parseTime=true"}
        - {name: OTEL_SERVICE_NAME, value: "reading-go"}
        - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.esp-observability.svc.cluster.local:4317"}
