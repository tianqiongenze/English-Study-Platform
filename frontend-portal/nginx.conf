# frontend-portal nginx:统一多端入口。
# 职责:
#   1. 自身托管 portal 入口页 index.html(纯静态,无构建)
#   2. /web/ → 反代 frontend-react(同 ns ClusterIP:80)
#   3. /h5/  → 反代 frontend-h5(同 ns ClusterIP:80)
#   4. /api/ + /ws/ → 按 path 直连各后端 ClusterIP(复刻 esp-ingress 路由规则)
#
# 设计:portal 作为唯一 NodePort(30070)对外暴露,Mac host 可达。
# 内部前端三个容器(frontend-react/h5/miniprogram 源码)通过 ClusterIP 复用,不重复暴露 NodePort。
# 符合 education-platform 的 portal 模式(单域名分发多端),但用 NodePort 替代 traefik LB。
#
# 路由说明(2026-08-14):原设计 /api /ws 反代 traefik(Host esp.example.com)由 Ingress 分发,
# 但单节点 traefik ingress controller pod 已不在运行(svc traefik 仍是 LoadBalancer 但 endpoints <none>),
# 故改为按 path 直连各后端 ClusterIP,复刻 esp-ingress 的 9 条 path 规则,绕过 traefik 依赖。

upstream react_backend {
    server frontend-react:80;
}
upstream h5_backend {
    server frontend-h5:80;
}
upstream bff_backend {
    server bff-java:8090;
}
upstream gateway_backend {
    server gateway-go:80;
}
upstream admin_backend {
    server esp-admin:80;
}

server {
    listen 80;
    server_name _;

    # portal 入口页(根路径)
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }
    location = /index.html {
        root /usr/share/nginx/html;
    }

    # Web 端:frontend-react 全量反代(react 自身的 /api /ws 由它自己再反代 traefik)
    location /web/ {
        proxy_pass http://react_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # react 子应用自身的 /api /ws 请求会带 /web 前缀,这里重写回根
        # 注:react 内 nginx 对 /api 已配反代,此处透传即可
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # H5 端:frontend-h5 全量反代
    location /h5/ {
        proxy_pass http://h5_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # /api/admin 管理员监测门户 → esp-admin(统一聚合 API,先于其它 /api/ 前缀匹配)
    location /api/admin/ {
        proxy_pass http://admin_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_read_timeout 30s;
        proxy_connect_timeout 3s;
    }

    # P0-3 IDOR 收敛(2026-08-21 修):所有 /api/** 业务流量经 bff-java(单一鉴权入口)。
    # bff EdgeAuthHandler 剥离外网伪造的 X-User-Id/X-Role → 校验 JWT → 注入可信 X-User-Id/X-Role
    # → RouteTable 按前缀转发下游(learning/community/gamification/content/emotion/writing/teacher/scenarios/sessions)。
    # 历史问题:原 portal 直连各后端 ClusterIP 绕过 bff,致 ① learning-java 取不到 JWT 注入的 userId → 401;
    # ② community/gamification 无路由 → 404;③ content-go 无身份注入。全部经 bff 一并解决。
    # 与 esp-ingress(Traefik)路由模型一致,但 portal 直连 bff-backend 省一跳(traefik 仅做 ingress LB)。
    # AI 助手对话(前端 AIAssistant 浮层):直连 gateway-go(其自身验 JWT + LCO 三层缓存)。
    # 不经 bff(gateway-go userIDFromRequest 自验 JWT);AI 推理 8-34s + 缓存命中 ~10ms,给 90s 超时。
    location /api/llm/ {
        proxy_pass http://gateway_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_read_timeout 90s;
        proxy_connect_timeout 5s;
    }

    # AI 推理(writing/langgraph 8-34s)给 120s 超时,与既有 /api/writing 一致。
    location /api/ {
        proxy_pass http://bff_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    # BFF actuator 健康检查(门户诊断卡片用,bff 对 /api/* 有鉴权,/actuator/* 放行)
    location /api/actuator/ {
        rewrite ^/api/actuator/(.*)$ /actuator/$1 break;
        proxy_pass http://bff_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_connect_timeout 3s;
    }

    # /docs + /swagger-ui + /v3/api-docs —— API 在线测试(Swagger UI)反代到 bff-java。
    # bff 已集成 springdoc-openapi(/docs 聚合门户入口 + /swagger-ui + /v3/api-docs 全就绪)。
    # 前端 AdminLayout "API 测试" Tab iframe 嵌 /docs,同源自动带 esp_token httpOnly cookie。
    # swagger-ui 静态资源 + api-docs JSON 都在 bff /docs/* /swagger-ui/* /v3/api-docs 下。
    location /docs {
        proxy_pass http://bff_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
    location /swagger-ui {
        proxy_pass http://bff_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
    location /v3/api-docs {
        proxy_pass http://bff_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # /ws 反代到 gateway-go(WebSocket 长连接,需 upgrade 头)
    location /ws/ {
        proxy_pass http://gateway_backend;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
