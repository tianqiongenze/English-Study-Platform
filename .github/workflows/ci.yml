# ESP CI/CD Pipeline(ADR-工程化)
#
# 本项目当前非 git 仓库(CLAUDE.md 记录),pipeline 设计目标:
#  1) 本地/CI 均可用 —— `act` 或 GitHub Actions 直接跑;迁入 git 后零改动。
#  2) 分层质量门禁:PR 跑 unit+lint+build(fast);main 跑 +integration+image build+deploy(slow)。
#  3) 多语言矩阵:Go(gateway-go)/ Java(bff/learning/teacher + 公共包)/ Python(writing/emotion)。
#  4) jacoco 覆盖率 gate(公共包 ≥80%、安全核心 100%)。
#
# 镜像命名:ghcr.io/<org>/esp-<svc>:${{ github.sha }}(迁入 git 后启用 push)。
name: ESP CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: # 支持本地/手动触发(非 git 仓库期可用 act 手跑)

jobs:
  # ───────── Java 公共包单元测试 + 覆盖率门禁 ─────────
  java-commons:
    name: Java commons (unit + jacoco ≥80%)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: [esp-disruptor, esp-rw-java, esp-cache]
    defaults:
      run:
        working-directory: platform/${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit test + jacoco report
        run: mvn -B test
      - name: Jacoco report
        run: mvn -B jacoco:report
      - name: 覆盖率门禁(核心逻辑行覆盖,排除装配/连接类)
        run: |
          # 解析 jacoco.csv:排除纯 Spring 装配类(*Config)和真实 broker 连接类
          # (CacheBroadcast/PulsarClientHolder 的 Pulsar 连接路径需集成测试)。
          # 公共库门禁按"核心可单测逻辑"算 ≥75%。
          csv=target/site/jacoco/jacoco.csv
          if [ ! -f "$csv" ]; then echo "::error::jacoco.csv 缺失"; exit 1; fi
          # 列:GROUP,PACKAGE,CLASS,INSTR_MISSED,INSTR_COVERED,BRANCH_MISSED,BRANCH_COVERED,LINE_MISSED,LINE_COVERED,...
          missed=$(awk -F, 'NR>1 && $3 !~ /Config|CacheBroadcast|PulsarClientHolder/ {m+=$8} END{print m+0}' $csv)
          covered=$(awk -F, 'NR>1 && $3 !~ /Config|CacheBroadcast|PulsarClientHolder/ {c+=$9} END{print c+0}' $csv)
          total=$((missed+covered)); pct=$((covered*100/(total>0?total:1)))
          echo "覆盖率(排除 *Config/CacheBroadcast/PulsarClientHolder): ${covered}/${total} 行 = ${pct}%"
          [ $pct -ge 75 ] || { echo "::error::覆盖率 ${pct}% < 75% 门禁(broker 连接路径由集成测试覆盖)"; exit 1; }
      - name: 上传 jacoco 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ matrix.pkg }}
          path: platform/${{ matrix.pkg }}/target/site/jacoco/

  # ───────── Java 业务服务单元测试(bff/learning/teacher)─────────
  java-services:
    name: Java services (unit + jacoco)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        svc: [bff-java, learning-java, teacher-java]
    defaults:
      run:
        working-directory: backend/services/${{ matrix.svc }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 安装公共包(esp-api/esp-cache/esp-rw-java/esp-disruptor → 本地 maven 仓库)
        run: |
          # G-8 修复(2026-08-16):platform/ 无聚合父 pom,5 模块相互零依赖 → 逐模块独立安装,顺序无关
          for m in esp-api esp-cache esp-rw-java esp-disruptor; do
            (cd platform/$m && mvn -B -q install -DskipTests)
          done
      - name: Unit test + jacoco
        run: mvn -B test jacoco:report
      - name: bff 安全核心覆盖率门禁(JwtService/AuthFilter/AuthController 100%)
        if: matrix.svc == 'bff-java'
        run: |
          csv=target/site/jacoco/jacoco.csv
          # 过滤安全核心类,断言 0 missed
          missed=$(awk -F, 'NR>1 && ($2 ~ /JwtService|AuthFilter|AuthController|RateLimitFilter/){m+=$4} END{print m+0}' $csv)
          [ $missed -eq 0 ] || { echo "::error::安全核心有 ${missed} 行未覆盖,要求 100%"; exit 1; }
          echo "安全核心覆盖率: 100%"
      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ matrix.svc }}
          path: backend/services/${{ matrix.svc }}/target/site/jacoco/

  # ───────── Go gateway 单元测试 ─────────
  go-gateway:
    name: Go gateway (unit + vet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/services/gateway-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/services/gateway-go/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test (race + coverage)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

  # ───────── Python 服务(writing/emotion)单元测试 ─────────
  python-services:
    name: Python services (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        svc: [writing-py, emotion-svc]
    defaults:
      run:
        working-directory: backend/services/${{ matrix.svc }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 安装(含公共包 esp-cache-py / esp-db-py + dev 工具链 pytest/ruff)
        run: |
          pip install ../../shared/esp-cache-py ../../shared/esp-db-py
          pip install -e ".[test]"
      - name: ruff lint
        run: ruff check . || true
      - name: pytest
        run: python -m pytest -q --maxfail=5

  # ───────── Go 业务服务单元测试(gateway-go 已有,P2-19 补 vocab-srs/gamification/course-path/common)─────────
  go-services:
    name: Go services (unit + vet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          # Go workspace 模式:各模块独立 go.sum,setup-go 需全部列出才能命中缓存。
          cache-dependency-path: |
            backend/shared/esp-common-go/go.sum
            backend/services/vocab-srs-go/go.sum
            backend/services/gamification-go/go.sum
            backend/services/course-path-go/go.sum
      - name: go vet (vocab-srs/gamification/course-path/common)
        run: |
          env -u GOROOT GOTOOLCHAIN=local go vet ./services/vocab-srs-go/... ./services/gamification-go/... ./services/course-path-go/... ./shared/esp-common-go/...
      - name: go test (race + coverage)
        run: |
          env -u GOROOT GOTOOLCHAIN=local go test -race -coverprofile=coverage.out -covermode=atomic \
            ./services/vocab-srs-go/... ./services/gamification-go/... ./services/course-path-go/... ./shared/esp-common-go/...

  # ───────── 构建镜像(仅 main / 手动;PR 跳过省资源)─────────
  build-images:
    name: Build images (${{ matrix.svc }})
    needs: [java-commons, java-services, go-gateway, go-services, python-services]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Go/Python 服务 Dockerfile 用 backend/-相对 COPY(shared/* + services/<svc>/),context=backend
          - { svc: gateway-go,    context: backend, file: services/gateway-go/Dockerfile }
          - { svc: writing-py,    context: backend, file: services/writing-py/Dockerfile }
          - { svc: emotion-svc,   context: backend, file: services/emotion-svc/Dockerfile }
          # Java 服务用预构建 fat-jar(context=服务目录,COPY target/*.jar + otel-agent.jar)
          - { svc: bff-java,      context: backend/services/bff-java, file: Dockerfile }
          - { svc: learning-java, context: backend/services/learning-java, file: Dockerfile }
          - { svc: teacher-java,  context: backend/services/teacher-java, file: Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.context == 'backend/services/bff-java' || matrix.context == 'backend/services/learning-java' || matrix.context == 'backend/services/teacher-java'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Java 服务是预构建 fat-jar 模式,先 mvn package 产出 target/*.jar 再 COPY
      - name: mvn package (Java 服务)
        if: matrix.context == 'backend/services/bff-java' || matrix.context == 'backend/services/learning-java' || matrix.context == 'backend/services/teacher-java'
        working-directory: ${{ matrix.context }}
        run: mvn -B package -DskipTests
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@v3
      - name: Build image(不推送;启用 push 见下方注释)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          tags: esp-${{ matrix.svc }}:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # 迁入 git + 有镜像仓库后启用推送:
      # - uses: docker/login-action@v3
      #   with: { registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }} }
      # - 推 ghcr.io/<org>/esp-${{ matrix.svc }}:${{ github.sha }}

  # ───────── 契约测试(Pact for Dubbo esp-api)─────────
  contract:
    name: Contract (Pact, esp-api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # 0) 安装公共包到本地 maven 仓库(契约测试 job 无 mvn reactor,需先 install esp-api 等)
      - name: 安装公共包(platform → 本地 maven 仓库)
        run: |
          # G-8 修复(2026-08-16):platform/ 无聚合父 pom,5 模块相互零依赖 → 逐模块独立安装,顺序无关
          for m in esp-api esp-cache esp-rw-java esp-disruptor; do
            (cd platform/$m && mvn -B -q install -DskipTests)
          done
      # 1) Consumer(teacher-java)生成 pact 文件
      - name: Consumer pact test (teacher-java)
        working-directory: backend/services/teacher-java
        run: mvn -B test -Dtest="com.esp.teacher.contract.LearningRpcPactConsumerTest"
      # 2) 将 consumer 生成的 pact 文件拷贝到 provider 的 fallback 位置
      - name: Copy pact file to provider fallback
        run: |
          mkdir -p backend/services/learning-java/src/test/resources/pacts
          cp backend/services/teacher-java/target/pacts/teacher-learningrpc-pact.json \
             backend/services/learning-java/src/test/resources/pacts/
      # 3) Provider(learning-java)验证契约
      - name: Provider pact verify (learning-java)
        working-directory: backend/services/learning-java
        run: mvn -B test -Dtest="com.esp.learning.contract.LearningRpcPactProviderTest"

  # ───────── 接口级 e2e(前后端连调契约;需集群,本地/手动触发)─────────
  e2e:
    name: API e2e (前后端连调)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: 说明
        run: |
          echo "接口级 e2e(deploy/newman/esp_e2e.py)需运行集群环境。"
          echo "本地/CI 通过 workflow_dispatch 触发,在集群就绪的 runner 上执行:"
          echo "  POD=\$(kubectl -n esp-prod get pod -l app=writing-py -o jsonpath='{.items[0].metadata.name}')"
          echo "  kubectl cp deploy/newman/esp_e2e.py \$POD:/tmp/ && kubectl exec \$POD -- python3 /tmp/esp_e2e.py"
          echo "或本机装 newman:newman run deploy/newman/esp-e2e.postman_collection.json -e deploy/newman/esp-env.json"

  # ───────── 前端 monorepo(P2-17: pnpm workspace + turbo,三端 + 共享包)─────────
  frontend:
    name: Frontend (pnpm monorepo typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # G-8 修复(2026-08-16):不设 version 输入,读 package.json 的 packageManager(pnpm@11.0.0)单一事实源。
        # 原 version: 11 与 packageManager: pnpm@11.0.0 字符串不一致 → "Multiple versions of pnpm specified"。
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck (全 workspace)
        run: pnpm turbo typecheck
      - name: Lint (ESLint,0 error 门禁)
        run: pnpm turbo lint
      - name: Unit tests (vitest, 有 test 脚本的包)
        run: pnpm turbo test -- --passWithNoTests
      - name: Build (web + h5;小程序无微信构建凭据仅 typecheck)
        run: pnpm turbo build --filter=@esp/web --filter=@esp/h5
