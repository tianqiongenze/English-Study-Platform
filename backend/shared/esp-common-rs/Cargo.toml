[package]
name = "esp-common-rs"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "esp_common"
path = "src/lib.rs"

[dependencies]
# 与各 Rust 服务对齐版本(axum 0.7 / sqlx 0.7 / redis 0.26 / tracing 0.1)
axum = { version = "0.7", features = ["json", "tokio", "http1"] }
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-rustls", "macros", "chrono"] }
redis = { version = "0.26", features = ["tokio-comp", "aio", "connection-manager", "cluster", "cluster-async"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

# Prometheus /metrics 端点(Phase1 子项 1.2,4 个 Rust 服务共用 esp_common::metrics::metrics_router)
prometheus = "0.13"

# 测试依赖(Router::oneshot 走 tower::ServiceExt;axum 0.7 不默认 re-export oneshot)
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
