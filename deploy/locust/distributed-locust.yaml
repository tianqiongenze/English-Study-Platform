# distributed-locust.yaml — P2-3 分布式 Locust master + worker 模板
#
# 单节点 RD 不 apply(资源不足)。迁移到多节点服务器后:
#   kubectl create ns esp-loadtest 2>/dev/null || true
#   kubectl apply -f deploy/locust/distributed-locust.yaml
#   kubectl -n esp-loadtest scale deploy/locust-worker --replicas=5   # 5000 CCU / 1000 每 worker
#
# 被测集群与压测集群必须物理隔离(不同节点),用 nodeSelector/taint 把 locust worker
# 调度到压测专用节点,避免压测吃被测资源(架构评分 §三 已验证单节点混合上限瓶颈)。
---
apiVersion: v1
kind: Namespace
metadata:
  name: esp-loadtest
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: locustfile
  namespace: esp-loadtest
data:
  locustfile.py: |
    # locustfile 内容由 deploy/locust/locustfile.py 提供,apply 前用以下命令灌入:
    # kubectl -n esp-loadtest create cm locustfile --from-file=locustfile.py=deploy/locust/locustfile.py
    # 此占位仅为模板结构示意,实际压测前必须替换为真实 locustfile。
    pass
---
# Locust Master:调度 + 聚合统计,不产生负载
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-master
  namespace: esp-loadtest
spec:
  replicas: 1
  selector: {matchLabels: {app: locust-master}}
  template:
    metadata: {labels: {app: locust-master}}
    spec:
      containers:
      - name: master
        image: locustio/locust:2.31.5
        args: ["-f", "/mnt/locust/locustfile.py", "--master", "--expect-workers", "5"]
        ports:
        - {containerPort: 8089, name: web}     # Web UI
        - {containerPort: 5557, name: comms}    # master-worker 通信
        env:
        - {name: TARGET_HOST, value: "http://gateway-go.esp-prod.svc.cluster.local"}
        volumeMounts:
        - {name: locustfile, mountPath: /mnt/locust}
        resources:
          requests: {cpu: "500m", memory: 512Mi}
          limits: {cpu: "1", memory: 1Gi}
      volumes:
      - name: locustfile
        configMap: {name: locustfile}
---
apiVersion: v1
kind: Service
metadata:
  name: locust-master
  namespace: esp-loadtest
spec:
  selector: {app: locust-master}
  ports:
  - {name: web, port: 8089, targetPort: 8089}
  - {name: comms, port: 5557, targetPort: 5557}
---
# Locust Worker:实际产生并发用户,水平扩展
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-worker
  namespace: esp-loadtest
spec:
  replicas: 5                          # 5000 CCU / 1000 每 worker(按节点 CPU 调)
  selector: {matchLabels: {app: locust-worker}}
  template:
    metadata: {labels: {app: locust-worker}}
    spec:
      # 多节点生产:把 worker 调度到压测专用节点,避免与被测服务混部
      # nodeSelector:
      #   role: loadtest
      containers:
      - name: worker
        image: locustio/locust:2.31.5
        args: ["-f", "/mnt/locust/locustfile.py", "--worker", "--master-host", "locust-master"]
        env:
        - {name: TARGET_HOST, value: "http://gateway-go.esp-prod.svc.cluster.local"}
        volumeMounts:
        - {name: locustfile, mountPath: /mnt/locust}
        resources:
          requests: {cpu: "1", memory: 1Gi}
          limits: {cpu: "2", memory: 2Gi}
      volumes:
      - name: locustfile
        configMap: {name: locustfile}
