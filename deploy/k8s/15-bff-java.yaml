# bff-java: 边缘接入(Netty 9090)+ Spring MVC 控制器/auth/actuator(8090)+ Dubbo Triple(50090)
# 对外接入端口 9090,经 Ingress 或 gateway-go 转发,本期 ClusterIP(不擅自加 NodePort 以免端口冲突)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-java
  namespace: esp-prod
spec:
  replicas: 1
  selector: {matchLabels: {app: bff-java}}
  template:
    metadata: {labels: {app: bff-java}, annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8090", prometheus.io/path: "/actuator/prometheus"}}
    spec:
      securityContext:              # Phase1 1.6: pod 级 fsGroup+seccompProfile
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: bff-java
        image: esp/bff-java:1.16.1   # 1.16.1(暂留,未升1.16.2):1.16.2 build 含会话23-28/29加的spring-boot-starter-graphql依赖,但启动报MissingSchemaException(spring.graphql.schema.locations yml配String可能需List格式ASV核实)→1.16.2崩;1.16.1旧镜像jar不含graphql依赖可跑。冷启动优化(G1GC+TieredStopAtLevel+gRPC8s)Dockerfile已改但需先修graphql schema bug才能rebuild 1.16.2部署。graphql bug+冷启动优化rebuild=下一步单独会话。1.16.1=RouteTable Nacos动态版+JwtValidator;JDK26+ZGC基底
        imagePullPolicy: IfNotPresent
        ports:
        - {containerPort: 8090,  name: mvc}
        - {containerPort: 9090,  name: edge}
        - {containerPort: 50090, name: dubbo}
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
        env:
        - {name: NACOS_ADDR,    value: "nacos:8848"}
        - {name: NACOS_NS,      value: "public"}
        - {name: SENTINEL_DASH, value: "sentinel:8858"}
        - {name: SEATA_ENABLED, value: "false"}   # #146 清理 Seata AT 死配置:TC 已 scale 0,关 Seata 启动(yaml 漂移修正:原 true 致新 pod 连不上 TC CrashLoop)
        - {name: JWT_SECRET,    valueFrom: {secretKeyRef: {name: esp-secrets, key: JWT_SECRET, optional: true}}}
        # #140/#145 切 CRDB:ESP_RW_STORAGE_TYPE=cockroachdb 激活 esp-rw-java 的 CockroachDbDataSourceConfig(@ConditionalOnProperty),
        # 由 ESP_RW_COCKROACHDB_* 派生 jdbc:postgresql://crdb-public:26257/esp?sslmode=disable(PG 双池),yml 的 WRITE_DB_URL/READ_DB_URL(MySQL)被忽略。
        # 保留 WRITE_DB_URL 仅为可回切 TiDB(改 ESP_RW_STORAGE_TYPE=tidb 即恢复 MySQL 池)。
        - {name: ESP_RW_STORAGE_TYPE,       value: "cockroachdb"}
        - {name: ESP_RW_COCKROACHDB_HOST,   value: "crdb-public"}
        - {name: ESP_RW_COCKROACHDB_READ_HOST, value: "crdb-public"}   # 单节点 CRDB,读写同址(follower-read 由 esp-common-go/esp-rw 在连接参数层加 AS OF SYSTEM TIME)
        - {name: ESP_RW_COCKROACHDB_PORT,   value: "26257"}
        - {name: ESP_RW_COCKROACHDB_DB,     value: "esp_auth"}   # #227 根因修复:BFF users 表对齐 gamification-go 写入的 esp_auth.users(超集,含 digital_human/ranking_opt_out/region_code);原 esp.users 仅 6 列缺这些列致 gamification UPDATE 静默失败。esp.users 257 行已迁移 esp_auth.users
        - {name: ESP_RW_COCKROACHDB_USER,   value: "root"}
        - {name: WRITE_DB_URL,  value: "jdbc:mysql://tidb-primary:4000/esp?useSSL=false&allowPublicKeyRetrieval=true"}   # 可回切保留
        - {name: DB_USER,       value: "root"}
        - {name: DB_PASS,       value: ""}
        - {name: REDIS_HOST,    value: "redis-cluster"}
        - {name: WX_LOGIN_ENABLED, value: "false"}
        # OTel 注入(ADR-observability-rebuild):javaagent 已在镜像 JAVA_OPTS 中(Dockerfile ENTRYPOINT),
        # 这里只补 OTEL_* env 配置(agent 已加载,仅需配置 service 名/exporter 端点)。
        # 注:本轮只写 manifest + 代码,不 build 部署(资源紧张,灌数完成后再 build+scale)
        - {name: OTEL_SERVICE_NAME, value: "bff"}
        - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.esp-prod.svc.cluster.local:4317"}
        - {name: OTEL_TRACES_EXPORTER, value: "otlp"}
        - {name: OTEL_LOGS_EXPORTER, value: "none"}
        envFrom:
        - secretRef: {name: esp-rsa-jwt-sign}   # P0-1 私钥收敛:BFF 是唯一签发方,持有私钥(RS256 sign)
        startupProbe:   {httpGet: {path: /actuator/health/liveness, port: 8090}, initialDelaySeconds: 30, periodSeconds: 10, failureThreshold: 120, timeoutSeconds: 5}   # 1230s 慢启动保护(RS256+Nacos+Seata+Dubbo 注册慢)
        readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8090}, periodSeconds: 10, failureThreshold: 3, timeoutSeconds: 5}   # 探针 timeout 3→5s(P1-D10 压测前调优,AI 推理 8-34s + GC 抖动防误杀,esp-loadtest-probe-pitfalls)
        livenessProbe:  {httpGet: {path: /actuator/health/liveness, port: 8090}, periodSeconds: 15, failureThreshold: 5, timeoutSeconds: 3}
        resources:
          requests: {cpu: "200m", memory: 512Mi}   # BFF 作为边缘接入层需要更高 CPU 分配以处理 Netty I/O + Spring MVC + Dubbo Triple
          limits:   {cpu: "2",     memory: 3Gi}   # P1-D21(2026-08-21 k6 OOM根治):k6压测pbbm7内存1850Mi<2Gi仍OOMKilled,根因是Java进程RSS=堆(MaxRAMPercentage75%→~2.3Gi)+Netty direct buffer+Metaspace+线程栈+code cache高并发下堆外膨胀超cgroup memory.max;3Gi给堆外留余量。多节点生产可再评估(单节点资源紧)
        # RWP铁律(防御性挂载):未开readOnlyRootFilesystem当前不崩,防将来开readOnly再踩;Dubbo3.3.6写/.dubbo + Nacos SDK硬编码/logs/nacos
        volumeMounts:
        - {name: nacos-logs, mountPath: /logs}
        - {name: dubbo-meta, mountPath: /.dubbo}
      # RWP铁律(防御性挂载):emptyDir供Nacos /logs + Dubbo /.dubbo写入
      volumes:
      - {name: nacos-logs, emptyDir: {}}
      - {name: dubbo-meta, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: bff-java
  namespace: esp-prod
spec:
  selector: {app: bff-java}
  ports:
  - {name: mvc,   port: 8090,  targetPort: 8090}
  - {name: edge,  port: 9090,  targetPort: 9090}
  - {name: dubbo, port: 50090, targetPort: 50090}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bff-java
  namespace: esp-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bff-java
  minReplicas: 1
  maxReplicas: 1   # 单节点止血态(2026-08-21):k6 压测实测 bff-java ~2000CCU 档 OOM(151s冷启动+1536Mi不足+HPA扩容新pod启动期即崩);单节点9核扩4个JVM抢CPU触发慢启动恶性循环(load飙24.97)。maxReplicas=1 止住扩容循环,bff pbbm7 稳定1/1。多节点生产恢复 maxReplicas=4(此时扩容跨节点不抢CPU)。关联 esp-singlenode-host-cluster-contention。
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
