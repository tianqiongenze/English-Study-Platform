# frontend-h5 nginx:静态托管 H5 SPA + /api 反代到集群 Ingress(Traefik via esp.example.com Host)
# 设计对齐 frontend-react(ADR-13):前端容器不直接耦合具体后端 Service,反代到 Traefik 由 Ingress 按 path 分发。
# H5 移动端与 Web 共用同一后端路由表,/api/* → Traefik → 各服务;/ws/* → Traefik → gateway-go。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # H5 SPA 构建 base=/h5/(vite base 与 router basename 均 /h5),但 dist 产物落在 nginx 根。
    # 2026-08-16 浏览器 E2E 实测坑㉟f:缺此映射时 /h5/assets/* 走 SPA 兜底返回 index.html,
    # 浏览器把 HTML 当 JS 解析 → #root 为空 → H5 白屏。此块把 /h5/* 重写回根静态文件。
    location ^~ /h5/ {
        rewrite ^/h5/(.*)$ /$1 break;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # SPA history 路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api 反代到集群 Ingress(Traefik),由 Ingress 按 path 分发到各服务
    location /api/ {
        proxy_pass http://traefik.kube-system.svc.cluster.local:80;
        proxy_set_header Host esp.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # traceparent 透传(断点6:前端→BFF trace 贯通)
        proxy_pass_request_headers on;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # /ws 反代到 gateway-go(WebSocket 长连接,ADR-13 旁路)
    location /ws/ {
        proxy_pass http://traefik.kube-system.svc.cluster.local:80;
        proxy_set_header Host esp.example.com;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }
}
