kind: Deployment
metadata: {name: gamification-go, namespace: esp-prod}
spec:
  replicas: 1              # S7 启用,单节点验证
  selector: {matchLabels: {app: gamification-go}}
  template:
    metadata: {labels: {app: gamification-go}}
    spec:
      containers:
      - name: gamification-go
        image: esp/gamification-go:0.2.0
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8092}]
        env:
        - {name: PORT, value: "8092"}
        - {name: READ_DB_URL, value: "root:@tcp(tidb-follower:4000)/esp_gamification?parseTime=true"}
        - {name: WRITE_DB_URL, value: "root:@tcp(tidb-primary:4000)/esp_gamification?parseTime=true"}
        - {name: REDIS_CLUSTER, value: "redis-cluster-new-0.redis-cluster-new.ekb-m2-aws-us-east-1.svc.cluster.local:6379"}
        - {name: OTEL_SERVICE_NAME, value: "gamification-go"}
        - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.esp-observability.svc.cluster.local:4317"}
        startupProbe:   {tcpSocket: {port: 8092}, periodSeconds: 10, failureThreshold: 30, timeoutSeconds: 5}
        readinessProbe: {tcpSocket: {port: 8092}, periodSeconds: 15, failureThreshold: 5, timeoutSeconds: 5}
        resources: {requests: {cpu: "100m", memory: 128Mi}, limits: {cpu: "500m", memory: 256Mi}}
