# learning-worker: P2-2 从 learning-java 拆出的 Disruptor 消费独立 Deployment
#
# 设计(ADR-09 演进):
#   - learning-java(HTTP 入口 + Dubbo Triple)专注请求响应,不再进程内 Disruptor 消费,
#     避免批量落库阻塞影响 HTTP P95。入口侧 esp.disruptor.enabled=false,reportEvent 走 Pulsar。
#   - learning-worker 订阅 Pulsar topic LEARNING_EVENT_REPORT(learning.event.report),
#     收到事件后进进程内 Disruptor → BatchEventHandler → DbLearningEventConsumer 落 learning_events 表。
#   - 复用 learning-java 同一镜像(同 main class),仅通过 env ESP_DISRUPTOR_ENABLED + ESP_ROLE 区分:
#       ESP_ROLE=worker  → 只启 Pulsar 订阅 + Disruptor 消费,关闭 HTTP/Dubbo(端口不暴露)
#       ESP_ROLE=api     → learning-java 原 behavior(单进程一体化,Disruptor enabled)
#   - worker 不需要 8081 HTTP / 50091 Dubbo 端口;健康探针用 actuator(独立 management 端口或子路径)。
#   - worker 侧 SEATA 可关闭(DbLearningEventConsumer 走 repo.saveAll 未经 @GlobalTransactional)。
#
# 单节点 RD:replicas=1(资源紧张);多节点生产按学情事件吞吐水平扩(Disruptor 消费是 CPU 密集)。
# 注意:本 Deployment 在单节点 RD 上为"就绪+可部署"状态,默认不 apply(避免与 learning-java
# 单进程模式同时跑导致重复消费)。启用步骤见 docs/design/p2-2-learning-worker-split.md。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: learning-worker
  namespace: esp-prod
spec:
  replicas: 1              # P1-11: 启用 worker 独立消费落库(单节点 RD 1 副本;多节点生产按学情吞吐水平扩)
  selector: {matchLabels: {app: learning-worker}}
  template:
    metadata: {labels: {app: learning-worker}}
    spec:
      containers:
      - name: learning-worker
        image: esp/learning-java:1.11.3   # #131:加 Pulsar 订阅 Shared(修 Exclusive 只能 1 消费者);#139 Timestamp 修复;#147 P1-8 幂等(messageId 透传 + ON CONFLICT DO NOTHING)
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        env:
        - {name: ESP_ROLE, value: "worker"}
        - {name: ESP_DISRUPTOR_ENABLED, value: "true"}      # worker 启 Disruptor 消费
        - {name: PULSAR_CONSUMER_ENABLED, value: "true"}     # 订阅 LEARNING_EVENT_REPORT(入口已关消费,无循环)
        # #140 全服务切 CRDB:数据访问层走 CockroachDB(稳定,替代单节点 TiKV region 不稳);写 esp_learning
        - {name: ESP_RW_STORAGE_TYPE,       value: "cockroachdb"}
        - {name: ESP_RW_COCKROACHDB_HOST,   value: "crdb-public"}
        - {name: ESP_RW_COCKROACHDB_READ_HOST, value: "crdb-public"}
        - {name: ESP_RW_COCKROACHDB_PORT,   value: "26257"}
        - {name: ESP_RW_COCKROACHDB_DB,     value: "esp_learning"}
        - {name: ESP_RW_COCKROACHDB_SHARED_DB, value: "esp_shared"}
        - {name: ESP_RW_COCKROACHDB_USER,   value: "root"}
        - {name: WRITE_DB_URL, value: "jdbc:mysql://tidb-primary:4000/esp_learning?useSSL=false&allowPublicKeyRetrieval=true"}   # 可回切保留
        - {name: READ_DB_URL, value: "jdbc:mysql://tidb-follower:4000/esp_learning?useSSL=false&allowPublicKeyRetrieval=true"}   # 可回切保留
        - {name: SHARED_DB_URL, value: "jdbc:mysql://tidb-primary:4000/esp_shared?useSSL=false&allowPublicKeyRetrieval=true"}   # 可回切保留
        - {name: DB_USER, value: "root"}
        - {name: DB_PASS, value: ""}
        - {name: REDIS_HOST, value: "redis-cluster"}
        - {name: NACOS_HOST, value: "nacos"}
        - {name: DUBBO_GROUP, value: "esp"}
        - {name: SEATA_ENABLED, value: "false"}              # worker 不参与全局事务,关 Seata 减负
        - {name: OTEL_SERVICE_NAME, value: "learning-worker"}
        - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.esp-prod.svc.cluster.local:4317"}
        - {name: OTEL_TRACES_EXPORTER, value: "otlp"}
        envFrom:
        - secretRef: {name: esp-rsa-jwt-verify}   # P0-1 私钥收敛:仅校验,只注入公钥
        # worker 无 HTTP 业务端口,actuator 健康探针仍走 8081(Spring management 默认同端口)
        startupProbe:   {httpGet: {path: /actuator/health, port: 8081}, periodSeconds: 10, failureThreshold: 90, timeoutSeconds: 5}
        readinessProbe: {httpGet: {path: /actuator/health, port: 8081}, periodSeconds: 10, failureThreshold: 3, timeoutSeconds: 3}
        livenessProbe:  {httpGet: {path: /actuator/health, port: 8081}, periodSeconds: 15, failureThreshold: 5, timeoutSeconds: 3}
        # preStop drain:Disruptor RingBuffer in-flight 事件落库
        lifecycle:
          preStop:
            exec: {command: ["sh","-c","sleep 15"]}
        resources:
          requests: {cpu: "100m", memory: 512Mi}
          limits: {cpu: "1", memory: 2048Mi}

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: learning-worker
  namespace: esp-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: learning-worker
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
