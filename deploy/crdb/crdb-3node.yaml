apiVersion: v1
kind: Namespace
metadata:
  name: esp-crdb
---
# Headless Service for stable pod DNS (crdb-0.crdb, crdb-1.crdb, crdb-2.crdb)
apiVersion: v1
kind: Service
metadata:
  name: crdb
  namespace: esp-crdb
  labels:
    app: crdb
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: crdb
  ports:
    - name: sql
      port: 26257
      targetPort: 26257
    - name: ui
      port: 8080
      targetPort: 8080
---
# ClusterIP Service for client access (single stable endpoint)
apiVersion: v1
kind: Service
metadata:
  name: crdb-public
  namespace: esp-crdb
  labels:
    app: crdb
spec:
  type: ClusterIP
  selector:
    app: crdb
  ports:
    - name: sql
      port: 26257
      targetPort: 26257
    - name: ui
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: crdb
  namespace: esp-crdb
  labels:
    app: crdb
spec:
  serviceName: crdb
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: crdb
  template:
    metadata:
      labels:
        app: crdb
    spec:
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: crdb
                topologyKey: kubernetes.io/hostname
      containers:
        - name: cockroachdb
          # 单节点 RD VM 为 aarch64;cockroach v24.3.11 默认 amd64 镜像走 qemu 转 SIGSEGV,
          # 故预拉 arm64 镜像并 tag 为 -arm64 后在此引用。多节点迁 amd64 节点时改回 cockroachdb/cockroach:v24.3.11。
          image: cockroachdb/cockroach:v24.3.11-arm64
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 26257
              name: sql
            - containerPort: 8080
              name: ui
          env:
            - name: POD_IP
              valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
            # 方案C locality 标签化:每个 pod 按 ordinal 注入 zone,使 follower-read 路由有锚点。
            # 单节点 VM 下 3 zone 共享物理资源,但代码路径(双池 + AS OF SYSTEM TIME)与多节点零差异,
            # 多节点落地仅改 affinity topologyKey=zone/region 即可真正分散。
            # 注:StatefulSet 的 args 模板无法直接读 POD_NAME ordinal,故用 initContainer 写 locality 文件,
            #     主容器读 LOCALITY_FILE 注入 --locality。
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          command:
            - /bin/sh
            - -ec
          args:
            - |
              # 按 pod ordinal 推导 zone(方案C:crdb-0→z1, crdb-1→z2, crdb-2→z3)
              ORDINAL=${NODE_NAME##*-}
              case $ORDINAL in
                0) ZONE=z1 ;;
                1) ZONE=z2 ;;
                2) ZONE=z3 ;;
                *) ZONE=z$ORDINAL ;;
              esac
              exec /cockroach/cockroach start \
                --insecure \
                --advertise-addr=$(POD_IP):26257 \
                --http-addr=$(POD_IP):8080 \
                --join=crdb-0.crdb,crdb-1.crdb,crdb-2.crdb \
                --locality=zone=$ZONE \
                --cache=.25Gi \
                --max-sql-memory=.25Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health?ready=1
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: datadir
              mountPath: /cockroach/cockroach-data
  volumeClaimTemplates:
    - metadata:
        name: datadir
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi
