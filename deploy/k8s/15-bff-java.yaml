# bff-java: 边缘接入(Netty 9090)+ Spring MVC 控制器/auth/actuator(8090)+ Dubbo Triple(50090)
# 对外接入端口 9090,经 Ingress 或 gateway-go 转发,本期 ClusterIP(不擅自加 NodePort 以免端口冲突)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-java
  namespace: esp-prod
spec:
  replicas: 1
  selector: {matchLabels: {app: bff-java}}
  template:
    metadata: {labels: {app: bff-java}}
    spec:
      containers:
      - name: bff-java
        image: esp/bff-java:1.10.0   # #145 CRDB 切库:ESP_RW_STORAGE_TYPE=cockroachdb 激活 esp-rw CockroachDbDataSourceConfig(PG 池);#135 esp-web-common + #137 CRDB 适配
        imagePullPolicy: IfNotPresent
        ports:
        - {containerPort: 8090,  name: mvc}
        - {containerPort: 9090,  name: edge}
        - {containerPort: 50090, name: dubbo}
        env:
        - {name: NACOS_ADDR,    value: "nacos:8848"}
        - {name: NACOS_NS,      value: "public"}
        - {name: SENTINEL_DASH, value: "sentinel:8858"}
        - {name: SEATA_ENABLED, value: "false"}   # #146 清理 Seata AT 死配置:TC 已 scale 0,关 Seata 启动(yaml 漂移修正:原 true 致新 pod 连不上 TC CrashLoop)
        - {name: JWT_SECRET,    valueFrom: {secretKeyRef: {name: esp-secrets, key: JWT_SECRET, optional: true}}}
        # #140/#145 切 CRDB:ESP_RW_STORAGE_TYPE=cockroachdb 激活 esp-rw-java 的 CockroachDbDataSourceConfig(@ConditionalOnProperty),
        # 由 ESP_RW_COCKROACHDB_* 派生 jdbc:postgresql://crdb-public:26257/esp?sslmode=disable(PG 双池),yml 的 WRITE_DB_URL/READ_DB_URL(MySQL)被忽略。
        # 保留 WRITE_DB_URL 仅为可回切 TiDB(改 ESP_RW_STORAGE_TYPE=tidb 即恢复 MySQL 池)。
        - {name: ESP_RW_STORAGE_TYPE,       value: "cockroachdb"}
        - {name: ESP_RW_COCKROACHDB_HOST,   value: "crdb-public"}
        - {name: ESP_RW_COCKROACHDB_READ_HOST, value: "crdb-public"}   # 单节点 CRDB,读写同址(follower-read 由 esp-common-go/esp-rw 在连接参数层加 AS OF SYSTEM TIME)
        - {name: ESP_RW_COCKROACHDB_PORT,   value: "26257"}
        - {name: ESP_RW_COCKROACHDB_DB,     value: "esp"}
        - {name: ESP_RW_COCKROACHDB_USER,   value: "root"}
        - {name: WRITE_DB_URL,  value: "jdbc:mysql://tidb-primary:4000/esp?useSSL=false&allowPublicKeyRetrieval=true"}   # 可回切保留
        - {name: DB_USER,       value: "root"}
        - {name: DB_PASS,       value: ""}
        - {name: REDIS_HOST,    value: "redis-cluster"}
        - {name: WX_LOGIN_ENABLED, value: "false"}
        # OTel 注入(ADR-observability-rebuild):javaagent 已在镜像 JAVA_OPTS 中(Dockerfile ENTRYPOINT),
        # 这里只补 OTEL_* env 配置(agent 已加载,仅需配置 service 名/exporter 端点)。
        # 注:本轮只写 manifest + 代码,不 build 部署(资源紧张,灌数完成后再 build+scale)
        - {name: OTEL_SERVICE_NAME, value: "bff"}
        - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4317"}
        - {name: OTEL_TRACES_EXPORTER, value: "otlp"}
        - {name: OTEL_METRICS_EXPORTER, value: "none"}
        - {name: OTEL_LOGS_EXPORTER, value: "none"}
        envFrom:
        - secretRef: {name: esp-rsa-jwt-sign}   # P0-1 私钥收敛:BFF 是唯一签发方,持有私钥(RS256 sign)
        startupProbe:   {httpGet: {path: /actuator/health/liveness, port: 8090}, initialDelaySeconds: 30, periodSeconds: 10, failureThreshold: 120, timeoutSeconds: 5}   # 1230s 慢启动保护(RS256+Nacos+Seata+Dubbo 注册慢)
        readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8090}, periodSeconds: 10, failureThreshold: 3, timeoutSeconds: 3}
        livenessProbe:  {httpGet: {path: /actuator/health/liveness, port: 8090}, periodSeconds: 15, failureThreshold: 5, timeoutSeconds: 3}
        resources:
          requests: {cpu: "200m", memory: 512Mi}
          limits:   {cpu: "1",     memory: 1536Mi}   # 原 1Gi 偏紧,Netty+Dubbo+Seata 三件套加压升内存
---
apiVersion: v1
kind: Service
metadata:
  name: bff-java
  namespace: esp-prod
spec:
  selector: {app: bff-java}
  ports:
  - {name: mvc,   port: 8090,  targetPort: 8090}
  - {name: edge,  port: 9090,  targetPort: 9090}
  - {name: dubbo, port: 50090, targetPort: 50090}
