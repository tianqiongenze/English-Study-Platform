# ============ Deployment: TiKV-aws ============
apiVersion: apps/v1
kind: Deployment
metadata: {name: tikv-aws, namespace: ekb-m2-aws-us-east-1}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: tikv-aws}}
  template:
    metadata: {labels: {app: tikv-aws, region: aws}}
    spec:
      containers:
        - name: tikv
          image: pingcap/tikv:v8.5.7
          imagePullPolicy: IfNotPresent
          command: ["/tikv-server"]
          args:
            - --addr=0.0.0.0:20160
            - --advertise-addr=tikv-aws.ekb-m2-aws-us-east-1.svc.cluster.local:20160
            - --data-dir=/data
            - --pd=pd-aws.ekb-m2-aws-us-east-1.svc.cluster.local:2379,pd-azure.ekb-m2-azure-eastasia.svc.cluster.local:2379,pd-gcp.ekb-m2-gcp-europe-west1.svc.cluster.local:2379
            - --config=/etc/tikv/tikv.toml
          ports: [{containerPort: 20160}]
          resources:
            requests: {cpu: 200m, memory: 1Gi}
            limits: {cpu: 1500m, memory: 3Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /etc/tikv}
          startupProbe:
            tcpSocket: {port: 20160}
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            tcpSocket: {port: 20160}
            periodSeconds: 15
            failureThreshold: 10
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: tikv-aws-data}
        - name: config
          configMap: {name: tikv-config}
---
